['ねえタロウ。いつか家族が増えたら、にぎやかになるわね。','あなたの隣が、私の定位置よ。','いつまでも負けないわ。あなたにも、年月にも。','この街が大きくなるたび、あなたを誇りに思うの。','何があっても大丈夫。私たち、最強のペアだもの。','またいつか、昔の日誌を一緒に読みましょう。','ありがとう、タロウ。これからもよろしくね。','さあ、次の目標を決めましょう。ふたりなら、きっと届くわ。']];
const qline=(L,r)=>QT[Math.min(9,Math.floor(r/10))][(2*Math.floor((L-1)/5)+(S.qn%2))%8];
const R=a=>a[Math.floor(Math.random()*a.length)];
const hs=q=>{let h=5381;for(const c of q)h=((h<<5)+h+c.codePointAt(0))|0;return h};
function daily(){
  PN=penalize();let ch=PN>0;
  const T=new Date(),td=dk(T);
  if(S.dd!==td){
    const e=earned(),L=lvOf(e),E=eraOf(L),L0=S.lvl||1,E0=eraOf(L0),W=WD[E],y=dayEarn(1),sk=stk();
    const y0=new Date(T.getFullYear(),T.getMonth(),T.getDate()-1).getTime(),pen=S.log.some(l=>l.d<0&&l.t>=y0&&l.t<y0+864e5&&l.l.startsWith('未達'));
    S.used=S.used||[];S.dn=S.dn||0;
    const fill=(q,x)=>q.replace(/\{(\w)\}/g,(_,k)=>x[k]);
    let tx,x;
    const mkx=()=>({p:R(W[0]),i:R(W[1]),f:R(W[2]),e:R(W[3]),t:nm(E),w:set().w,n:pop(e).toLocaleString(),y,s:sk});
    const lead=x=>fill(sk>=3&&Math.random()<.5?'連続{s}日の快進撃で、住人たちが胸を張っている。':R(pen?LP:y===0?LZ:y<100?LL:y<300?LM:LH),x);
    x=mkx();
    const bl=BL.filter(b=>b[0]>L0&&b[0]<=L).pop();
    if(S.dd==null)tx='洞穴の入口から、たったひとりの住人タロウが顔を出した。ここから街づくりが始まる。';
    else if(E>E0)tx=`時代が「${ER[E][1]}」に変わった。${nm(E)}の新しい物語が始まる。`+(bl?`「${bl[1]}」が完成した。`:'');
    else if(L>L0)tx=`Lv.${L}到達！`+(bl?`「${bl[1]}」が完成した。`:'街がまた少し大きくなった。');
    else if((S.rm||0)<RM.length&&e>=((S.rm||0)+1)*ROMP){const r=S.rm||0;tx=lead(x)+fill(RM[r],x);S.rm=r+1}
    else if((S.rm||0)>=RM.length&&S.dn%8===7)tx=lead(x)+fill(R(RC),x);
    else{let body,k=0;do{x=mkx();body=fill(R(TP),x);k++}while(S.used.includes(hs(body))&&k<50);S.used.push(hs(body));S.used=S.used.slice(-2000);tx=lead(x)+body}
    if(S.dd!=null&&S.dn%3===2){S.qn=(S.qn||0)+1;tx+='\n'+set().w+'「'+qline(L,S.rm||0)+'」'}
    S.diary=(S.diary||[]).concat([{d:td,t:tx,i:BL.filter(b=>b[0]<=L).pop()[2]}]).slice(-60);
    S.dd=td;S.lvl=L;S.dn++;ch=true;
  }
  if(ch)save();
  return ch;
}
function vS(){const c=set();return `<div class="sec">設定</div><div class="fm" style="border:1px solid var(--bd);border-radius:14px;box-shadow:none;max-height:none"><label>未達ペナルティの共通ポイント（0でなし・単発は対象外）</label><input id="s1" type="number" inputmode="numeric" min="0" value="${c.pen}"><label>パートナーの名前</label><input id="s2" value="${esc(c.w)}" maxlength="10"><div class="fb"><button class="p" data-a="sset">保存</button></div></div><div class="empty">ミッションごとに、個別のポイントや「ペナルティなし」も選べます。</div>`}
function town(){
  const e=earned(),L=lvOf(e),E=eraOf(L),nx=BL.find(b=>b[0]>L),ds=(S.diary||[]).slice(-7).reverse(),pr=L>=MAXL?100:(e%1000)/10;
  return `<div class="sec">街づくり<span>${ER[E][1]} ・ Lv.${L}/${MAXL} ・ 人口${pop(e).toLocaleString()}人</span></div><div class="card"><div style="font-size:24px;line-height:1.5;letter-spacing:1px">${BL.filter(b=>b[0]<=L).map(b=>b[2]).join('')}</div><div style="height:8px;border-radius:99px;background:var(--bd);margin:8px 0 4px;overflow:hidden"><div style="height:100%;width:${pr}%;background:var(--ac)"></div></div><div style="font-size:12px;color:var(--mut)">${L>=MAXL?'王国が完成しました！':`次のLvまであと${1000-e%1000}pt`}${nx?` ／ 次の建物「${nx[1]}」はLv.${nx[0]}`:''}</div></div><div class="sec">タロウの日誌<span>毎日1通</span></div><div class="card" style="padding:4px 12px">${ds.length?ds.map(x=>`<div class="lg"><div>${x.i} ${esc(x.t).replace(/\n/g,'<br>')}<i>${x.d}</i></div></div>`).join(''):'<div class="empty">日誌はまだありません</div>'}</div>`;
}
function vM(){
  let h='';
  for(const ty of Object.keys(TY)){
    const ms=S.missions.filter(m=>m.type===ty),n=ms.filter(doneE).length;
    h+=`<div class="sec">${TY[ty]}<span>${n}/${ms.length}</span></div>`;
    h+=ms.map(m=>`<div class="row ${doneE(m)?'done':''}"><button class="chk" data-a="done" data-i="${m.id}">${doneE(m)?'✓':''}</button><div class="nm">${esc(m.title)}</div><div class="pt">+${m.pts}${ep(m)&&m.type!=='once'?`<small style="color:var(--dg);display:block;font-size:10px;text-align:right">未達−${ep(m)}</small>`:''}</div><button class="ed" data-a="edit" data-k="m" data-i="${m.id}">✎</button></div>`).join('');
    if(!ms.length)h+=`<div class="empty" style="padding:8px">まだありません</div>`;
  }
  return h+`<button class="add" data-a="add" data-k="m">＋ ミッションを追加</button>`;
}
function vR(){
  const b=bal();
  let h=`<div class="sec">ご褒美リスト<span>ポイントで交換</span></div>`;
  h+=S.rewards.map(r=>`<div class="row">${icon(r)}<div class="nm">${esc(r.name)}</div><div class="pt">${r.cost}pt</div><button class="buy" data-a="buy" data-i="${r.id}" ${b<r.cost?'disabled':''}>交換</button><button class="ed" data-a="edit" data-k="r" data-i="${r.id}">✎</button></div>`).join('');
  if(!S.rewards.length)h+=`<div class="empty">ご褒美を登録しよう（例：好きなスイーツ 50pt）</div>`;
  return h+`<button class="add" data-a="add" data-k="r">＋ ご褒美を追加</button>`;
}
function vG(){
  const T=new Date(),t0=new Date(T.getFullYear(),T.getMonth(),T.getDate());
  let f=t0;if(S.log.length){const m=new Date(Math.min(...S.log.map(l=>l.t)));f=new Date(m.getFullYear(),m.getMonth(),m.getDate())}
  const st=range?new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-range+1):f;
  const n=Math.max(1,Math.round((t0-st)/864e5)+1);
  const at=i=>new Date(st.getFullYear(),st.getMonth(),st.getDate()+i).getTime();
  let c=S.log.filter(l=>l.t<st.getTime()).reduce((a,l)=>a+l.d,0),earn=0,spend=0;const v=[];
  for(let i=0;i<n;i++){
    for(const l of S.log)if(l.t>=at(i)&&l.t<at(i+1)){c+=l.d;if(l.d>0)earn+=l.d;else spend-=l.d}
    v.push(c);
  }
  const W=340,H=170,pl=36,pr=8,pt=12,pb=22;
  let mn=Math.min(...v,0),mx=Math.max(...v);if(mx===mn)mx=mn+1;
  const X=i=>pl+(n>1?i/(n-1):.5)*(W-pl-pr),Y=y=>pt+(1-(y-mn)/(mx-mn))*(H-pt-pb);
  const line=v.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const area=line+`L${X(n-1).toFixed(1)} ${Y(mn)}L${X(0).toFixed(1)} ${Y(mn)}Z`;
  const ds=i=>{const d=new Date(at(i));return (d.getMonth()+1)+'/'+d.getDate()};
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><path d="${area}" fill="var(--ac)" opacity=".15"/><path d="${line}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${n<=40?v.map((y,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.5" fill="var(--ac)"/>`).join(''):''}<g fill="var(--mut)" font-size="10"><text x="${pl-4}" y="${pt+4}" text-anchor="end">${mx}</text><text x="${pl-4}" y="${H-pb+3}" text-anchor="end">${mn}</text><text x="${pl}" y="${H-6}">${ds(0)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${ds(n-1)}</text></g></svg>`;
  const rb=(r,l)=>`<button data-a="range" data-i="${r}" class="${range===r?'on':''}">${l}</button>`;
  const recent=S.log.map((l,i)=>[l,i]).sort((a,b)=>b[0].t-a[0].t).slice(0,12);
  return `<div class="rng">${rb(7,'7日')}${rb(30,'30日')}${rb(90,'90日')}${rb(0,'全期間')}</div>
  <div class="card">${svg}</div>
  <div class="stats"><div>獲得<b>+${earn}</b></div><div>使用<b>−${spend}</b></div><div>現在<b>${bal()}</b></div></div>
  ${town()}<div class="sec">履歴</div><div class="card" style="padding:4px 12px">${recent.length?recent.map(([l,i])=>{const d=new Date(l.t);return `<div class="lg"><div>${esc(l.l)}<i>${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}</i></div><div class="pt" style="color:${l.d<0?'var(--dg)':'var(--ac)'}">${l.d>0?'+':'−'}${Math.abs(l.d)}</div><button data-a="undo" data-i="${i}">取消</button></div>`}).join(''):'<div class="empty">まだ記録がありません</div>'}</div>
  <div class="sec">バックアップ<span>データはこの端末内に保存されます</span></div><div class="card"><textarea id="bk" rows="3" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:12px monospace"></textarea><div class="fb"><button data-a="exp">書き出し</button><button data-a="imp">読み込み</button></div></div>`;
}
function vF(){
  const m=form.k==='m',it=form.id?(m?S.missions:S.rewards).find(x=>x.id===form.id):null;
  return `<div class="fm"><h3>${m?'ミッション':'ご褒美'}を${it?'編集':'追加'}</h3>
  <label>${m?'ミッション名':'ご褒美の名前'}</label><input id="f1" value="${form.n!=null?esc(form.n):it?esc(m?it.title:it.name):''}" maxlength="60">
  ${m?`<label>種類</label><select id="f2">${Object.keys(TY).map(k=>`<option value="${k}" ${it&&it.type===k?'selected':''}>${TY[k]}</option>`).join('')}</select>`:''}
  <label>${m?'もらえるポイント':'必要ポイント'}</label><input id="f3" type="number" inputmode="numeric" min="1" value="${form.c!=null?form.c:it?(m?it.pts:it.cost):''}">
  ${m?`<label>やらなかった時のペナルティ</label><select id="f5"><option value="d">共通設定に従う（${set().pen}pt）</option><option value="n" ${it&&it.noPen?'selected':''}>ペナルティなし</option></select><label>個別のポイント（空欄なら共通設定）</label><input id="f4" type="number" inputmode="numeric" min="0" value="${it&&it.pen>0?it.pen:''}">`:vIc()}<div class="fb"><button data-a="cancel">キャンセル</button>${it?`<button class="d" data-a="del">${arm?'もう一度で削除':'削除'}</button>`:''}<button class="p" data-a="save">保存</button></div></div>`;
}
function render(){
  $('#bal').textContent=bal().toLocaleString();
  const d=S.missions.filter(m=>m.type==='daily'),n=d.filter(doneE).length;
  $('#today').innerHTML=(d.length?`今日のデイリー <b style="font-size:16px">${n}/${d.length}</b><br>`:'')+`🔥連続${stk()}日 ×${mult().toFixed(2)}<br>今日 ${dayEarn(0)}/200pt`;
  $('#tabs').innerHTML=[['m','ミッション'],['r','ご褒美'],['g','グラフ'],['s','設定']].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  $('#main').innerHTML=tab==='m'?vM():tab==='r'?vR():tab==='s'?vS():vG();
  $('#sheet').innerHTML=form?vF():'';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,i=t.dataset.i,k=t.dataset.k;
  if(a==='tab'){tab=i}
  else if(a==='range'){range=+i}
  else if(a==='done'){
    const m=S.missions.find(x=>x.id===i),e2=doneE(m);
    if(e2){S.log.splice(S.log.indexOf(e2),1);toast('取り消しました')}
    else{const mu=mult(),g=Math.round(m.pts*mu);S.log.push({t:Date.now(),d:g,l:m.title,m:m.id,k:pk(m.type)});toast('クリア！ +'+g+'pt'+(mu>1?`（連続ボーナス×${mu.toFixed(2)}）`:''))}
    save();
  }
  else if(a==='buy'){
    const r=S.rewards.find(x=>x.id===i);
    if(bal()<r.cost){toast('ポイントが足りません')}
    else{S.log.push({t:Date.now(),d:-r.cost,l:'交換：'+r.name});toast(r.name+' をゲット！');save()}
  }
  else if(a==='exp'){const j=JSON.stringify(S);$('#bk').value=j;try{navigator.clipboard.writeText(j).then(()=>toast('コピーしました'),()=>toast('枠内の文字をコピーしてね'))}catch(x){toast('枠内の文字をコピーしてね')}return}
  else if(a==='imp'){try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.missions)||!Array.isArray(o.rewards)||!Array.isArray(o.log))throw 0;S=o;save();toast('読み込みました')}catch(x){toast('読み込めませんでした');return}}
  else if(a==='sset'){const c=set();c.pen=Math.max(0,parseInt($('#s1').value,10)||0);c.w=$('#s2').value.trim()||'ナツキ';save();toast('保存しました')}
  else if(a==='undo'){S.log.splice(+i,1);save()}
  else if(a==='add'){form={k,id:null,px:null,img:null,ser:0};arm=false}
  else if(a==='edit'){const it=(k==='m'?S.missions:S.rewards).find(x=>x.id===i);form={k,id:i,px:it.px||null,img:it.img||null,ser:0};arm=false}
  else if(a==='ser'){stash();form.ser=+i}
  else if(a==='pick'){stash();form.px=i;form.img=null}
  else if(a==='noic'){stash();form.px=null;form.img=null}
  else if(a==='photo'){$('#ff').click();return}
  else if(a==='cancel'){form=null;arm=false}
  else if(a==='del'){
    if(!arm){arm=true}
    else{const key=form.k==='m'?'missions':'rewards';S[key]=S[key].filter(x=>x.id!==form.id);form=null;arm=false;save()}
  }
  else if(a==='save'){
    const name=$('#f1').value.trim(),p=parseInt($('#f3').value,10);
    if(!name||!(p>0)){toast('名前とポイントを入力してね');return}
    const m=form.k==='m',key=m?'missions':'rewards';
    let it=form.id?S[key].find(x=>x.id===form.id):null;
    if(!it){it={id:uid()};S[key].push(it)}
    if(m){it.title=name;it.type=$('#f2').value;it.pts=p;it.pen=Math.max(0,parseInt($('#f4').value,10)||0);it.noPen=$('#f5').value==='n';if(!it.at)it.at=Date.now()}else{it.name=name;it.cost=p;it.px=form.px||null;it.img=form.img||null}
    form=null;save();
  }
  render();
});
document.addEventListener('change',e=>{
  const f=e.target.id==='ff'&&e.target.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const q=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,96,96);form.img=c.toDataURL('image/jpeg',.82);form.px=null;URL.revokeObjectURL(u);stash();render()};
  im.onerror=()=>toast('画像を読み込めませんでした');
  im.src=u;
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!form){daily();render();if(PN)toast('未達ペナルティが'+PN+'件ありました')}});
init();
</script>
