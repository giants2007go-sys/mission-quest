<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミッションクエスト</title>
<style>
:root{--bg:#e9f5ec;--card:#fff;--tx:#2a3a35;--mut:#6f8a80;--ac:#3f8fd2;--ok:#2fae8f;--bd:#a9d4c2;--dg:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#152019;--card:#1e2c24;--tx:#e6f2ea;--mut:#8fb0a0;--bd:#33503f}}
:root[data-theme="dark"]{--bg:#152019;--card:#1e2c24;--tx:#e6f2ea;--mut:#8fb0a0;--bd:#33503f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 14px 90px}
.hero{background:#4a9fd8;color:#fff;border-radius:18px;border:2px dashed #d7f0ff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end}
.hero small{opacity:.85;font-size:10px}.hero b{font-size:32px;line-height:1.1;display:block}
.hero .t{text-align:right;font-size:10px;opacity:.9}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:12px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 6px;font-weight:700}
.sec span{font-size:12px;color:var(--mut);font-weight:500}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--bd);border-radius:18px;padding:11px 12px;margin-bottom:7px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;color:#fff;font-size:16px;flex:none;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .nm{text-decoration:line-through;color:var(--mut)}
.nm{flex:1;min-width:0;word-break:break-word}
.pt{font-weight:700;color:var(--ac);white-space:nowrap}
.ed{border:0;background:none;color:var(--mut);font-size:16px;padding:4px}
.buy{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700}
.buy[disabled]{background:var(--bd);color:var(--mut)}
.add{width:100%;padding:12px;border:1.5px dashed var(--bd);background:none;color:var(--mut);border-radius:14px;font:inherit;margin-top:6px}
