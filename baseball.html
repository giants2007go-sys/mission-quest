<style>
:root{--bg:#eef5e9;--card:#fff;--tx:#2a3a35;--mut:#6f8a80;--ac:#3f8fd2;--ok:#2fae8f;--bd:#a9d4c2;--dg:#d9534f;--y:#ffd23f}

:root[data-theme="dark"]{--bg:#152019;--card:#1e2c24;--tx:#e6f2ea;--mut:#8fb0a0;--bd:#33503f}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px 14px 60px}

.hero{background:#2f7a4a;color:#fff;border-radius:18px;border:2px dashed #cfe8d8;padding:12px 14px;position:relative;overflow:hidden}
.hero .big{font-size:21px;font-weight:800;line-height:1.15;padding-right:130px}.hero small{font-size:11px;opacity:.9;display:block}
.hero .r{position:absolute;right:14px;top:10px;text-align:right;font-size:11px}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background:#c99a5b;border-top:2px solid #e8d9b0}
.tabs{display:flex;gap:5px;margin:12px 0}

#toast.on{transform:translate(-50%,0)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20}
.fm{background:var(--card);border-top:2px solid var(--bd);box-shadow:0 -8px 30px rgba(0,0,0,.18);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto}

.fb .p{background:var(--ac);border-color:var(--ac);color:#fff}

.tb button small{display:block;font-size:10px;margin-top:1px;font-weight:600;color:var(--mut)}
.tb button.bl{min-height:24px;flex-direction:row;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0}.tb button.bl small{display:inline;margin:0;font-size:11px}
.grab{width:44px;height:5px;border-radius:99px;background:var(--bd);margin:-6px auto 8px}
.fm{transition:transform .2s}.fm.drag{transition:none}
.fmh{position:sticky;top:-14px;margin:-14px -16px 0;padding:14px 16px 8px;background:var(--card);z-index:2;border-bottom:1px solid var(--bd)}.fmh h3{margin-bottom:4px}
.tb button:active{background:var(--ac);color:#fff}

.sv{display:flex;gap:5px}.sv button{flex:1;padding:7px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;font:inherit;font-size:12px}
.sv button[disabled]{opacity:.4}
</style>
</head>

const GT=(()=>{const t=[100];for(let x=1;x<160;x++)t[x]=(t[x-1]+1.24)*1.01;return t})();
const genC=x=>x<160?GT[Math.max(0,x)]:30*Math.pow(1.022,x);
const VT=(()=>{const t={120:3000};for(let q=121;q<150;q++)t[q]=(t[q-1]+271)*1.03;return t})();
const velC=q=>{if(q<150)return VT[Math.max(120,q)];let c=1330*Math.pow(1.116,q-125);if(q>=165)c*=3;else if(q>=160)c*=2;else c*=1.5;return c};
const unitOf=(k,x)=>k==='v'?kmh(x):k==='b'?brk(x):x;
const maxU=k=>k==='v'?169:k==='b'?24:255;
const toIdx=(k,u)=>k==='v'?vOf(u):k==='b'?Math.round(u/24*255):u;
function costUnit(k,u){
  if(k==='v')return velC(u);
  if(k==='b'){let c=0;for(let x=toIdx('b',u);x<toIdx('b',u+1);x++)c+=genC(x);return c}
  let c=genC(u);if(k==='p'){if(u>=240)c*=4;else if(u>=220)c*=2}return c;
}
function costOne(p,k,x){return costUnit(k,unitOf(k,x))}
function costN(p,k,n){const u=unitOf(k,p.st[k]);let c=0;for(let v=u;v<Math.min(u+n,maxU(k));v++)c+=costUnit(k,v);return Math.round(c)}

function teamPower(todaySP){
  const h=lineup().reduce((a,p,i)=>a+val(p)*ORD[i],0);

  h+=`<div class="mut" style="margin-top:8px">▲▼で並べ替え。上から順に打順・先発ローテーション・救援の役割が決まります。</div>`;
  return h;
}
function vF(){
  const p=S.roster.find(x=>x.id===form.id);if(!p)return '';
  const keys=p.pos==='B'?BAT:PIT,names=p.pos==='B'?BATN:PITN;
  let h=`<div class="fm"><div class="fmh"><div class="grab"></div><h3>${esc(p.name)}　<span class="pill">${p.pos==='B'?'野手':'投手'}</span>${p.tw?` <span class="pill" style="background:#d8c9f0">${TWN(p.tw)}</span>`:''}</h3><div style="font-size:14px;margin-bottom:2px">Combat Rating（CR） <b style="font-size:17px;color:var(--ac)">${fmt(val(p))}</b></div>${p.tw?`<div class="mut">${p.pos==='B'?'投手':'野手'}としての育成は、選手画面の${p.pos==='B'?'投手':'野手'}欄から${p.twinOf?'。売却は'+(p.pos==='B'?'投手':'野手')+'側から':''}</div>`:''}${(p.pos==='B'?batLine(p):pitLine(p))?`<div class="mut">通算 ${p.pos==='B'?batLine(p):pitLine(p)}</div>`:''}<div class="mut">年俸 ${money(p.sal)}/年（週 ${money(p.sal/52)}）　練習Pt ${fmt(S.pt)}</div></div>`;
  if(p.rent){h+=`<div class="empty">レンタル選手は育成できません（${p.rent.slice(5).replace('-','/')}まで在籍）</div>`}
  else{
  if(p.pos==='B'){const cb=costBal(p);h+=`<div class="st2"><div class="hd"><span>弾道</span><b>${p.bal}/4</b></div><div class="tb" style="margin-top:5px"><button class="bl" data-a="bal" data-i="${p.id}" ${p.bal>=4||S.pt<cb?'disabled':''}>${p.bal>=4?'最大':'弾道'+(p.bal+1)+'へ'}<small>${p.bal>=4?'':fmt(cb)+' Pt'}</small></button></div></div>`}
  keys.forEach(k=>{const x=p.st[k],star=(k==='p'&&x>=220)||(k==='v'&&kmh(x)>=150);
    h+=`<div class="st2"><div class="hd"><span>${names[k]}</span><b>${disp(p.st,k)}</b><span class="mut">${atMax(p,k)?'最大':'次の+1'+(k==='v'?'km/h':'')+'：'+fmt(costOne(p,k,x))+' Pt'}</span></div><div class="b"><i class="${star?'star':''}" style="width:${x/255*100}%"></i></div><div class="tb">${[1,5,10].map(n=>{const c=costN(p,k,n);return `<button data-a="tr" data-i="${p.id}" data-k="${k}" data-n="${n}" ${atMax(p,k)||S.pt<c?'disabled':''}>+${n}<small>${fmt(c)}</small></button>`}).join('')}</div></div>`});
  }
  h+=`<div class="fb">${p.pos==='P'?`<button data-a="role" data-i="${p.id}">${p.role==='SP'?'救援に回す':'先発に回す'}</button>`:''}${p.hero||p.twinOf||p.rent?'':`<button class="d" style="color:var(--dg)" data-a="sell" data-i="${p.id}">売却 ${money(p.fund/2)}</button>`}<button class="p" data-a="close">閉じる</button></div></div>`;
  return h;
}
const costBal=p=>[0,30000,300000,1500000][p.bal]||0;
function dbP(i){const r=DATA.db[i];const p={pos:r[1],sal:r[14]};if(r[1]==='B'){p.bal=r[3];p.st={m:r[4],p:r[5],r:r[6],a:r[7],f:r[8],c:r[9]}}else{p.role='SP';p.st={v:vOf(r[10]),k:r[11],s:r[12],b:Math.round(r[13]/24*255)}}return p}
const DBV={};const dbVal=i=>DBV[i]??(DBV[i]=val(dbP(i)));
function refVal(){const vs=S.roster.filter(p=>!p.rent).map(val).sort((a,b)=>b-a).slice(0,19);return Math.max(300,vs.reduce((a,v)=>a+v,0)/Math.max(1,vs.length))}
function dayList(){
  const td=dk(new Date());if(S.dl&&S.dl.d===td)return S.dl.ids;
  const ref=refVal(),own=new Set(S.bought);let r=(hs(td)^(S.ts||1))>>>0;
  const rnd=()=>{r=(r+0x6D2B79F5)>>>0;let t=r;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  const pick=(pos,lo,hi,n,out)=>{const c=DATA.db.map((_,i)=>i).filter(i=>!own.has(i)&&!out.includes(i)&&DATA.db[i][1]===pos&&dbVal(i)>=ref*lo&&dbVal(i)<ref*hi);for(let k=0;k<n&&c.length;k++){out.push(c.splice(Math.floor(rnd()*c.length),1)[0])}};
  const ids=[];
  for(const pos of ['B','P']){const st=ids.length;pick(pos,.6,.9,2,ids);pick(pos,.9,1.25,2,ids);pick(pos,1.25,1.8,1,ids);
    for(const [lo,hi] of [[.5,2.2],[.35,3],[0,1e9]])if(ids.length-st<5)pick(pos,lo,hi,5-(ids.length-st),ids)}
  ids.sort((x,y)=>dbVal(x)-dbVal(y));S.dl={d:td,ids};save();return ids;
}
const hs=q=>{let h=5381;for(const c of q)h=((h<<5)+h+c.codePointAt(0))|0;return h};
function vS(){
  const ref=refVal(),ids=dayList().filter(i=>!S.bought.includes(i));
  let h=`<div class="sec">今日のスカウト候補<span>資金 ${money(S.cash)}</span></div><div class="mut" style="margin:-2px 2px 8px">今のチームに近い実力の10人が、毎日入れ替わります（選手の平均Combat Rating（CR） ${fmt(ref)}）。</div>`;
  if(S.cash<0)h+=`<div class="card" style="border-color:var(--dg)"><b>資金がマイナスです</b><div class="mut">黒字に戻るまでスカウト・設備は買えません。年俸は週ごとに引かれ続けます。</div></div>`;
  h+=ids.map(i=>{const r=DATA.db[i],fund=r[15]*3.75,sal=r[14],v=dbVal(i),q=v/ref;const db_=`弾道${r[3]}・ミ${r[4]} パ${r[5]} 走${r[6]} 肩${r[7]} 守${r[8]} 捕${r[9]}`,dp_=`${r[10]}km/h コン${r[11]} スタ${r[12]} 変化${r[13]}`;const d=r[16]?(r[1]==='B'?db_+'<br>投：'+dp_:dp_+'<br>打：'+db_):(r[1]==='B'?db_:dp_);
    const tag=q<.9?['控え級','']:q<=1.25?['即戦力','y']:['大物','r'];
    return `<div class="row"><span class="pill">${r[1]==='B'?'野手':'投手'}</span><div class="nm">${esc(r[0])} <span class="pill ${tag[1]}">${tag[0]}</span>${r[16]?` <span class="pill" style="background:#d8c9f0">${r[16]===2?'二刀流':(r[1]==='B'?'投手は一応':'打撃は一応')}</span>`:''}<small>${d}<br>CR ${fmt(v)}　年俸 ${money(sal)}　${esc(r[2])}</small></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn ${S.cash>=fund?'g':''}" data-a="buy" data-i="${i}" ${S.cash<fund?'disabled':''}>契約 ${money(fund)}</button><button class="btn s" data-a="rent" data-i="${i}" ${S.cash<fund/5?'disabled':''}>3日レンタル ${money(fund/5)}</button></div></div>`}).join('')||'<div class="empty">今日の候補は全員獲得しました。明日また来てください</div>';
  return h;
}
function vB(){
  let h=`<div class="sec">球場<span>収入倍率と戦力バフ</span></div>`;
  STAD.forEach((s,i)=>{h+=`<div class="row"><span class="pill ${i===S.stad?'y':''}">Stage${i+1}</span><div class="nm">${s[0]}<small>資金×${s[2]}　戦力×${s[3]}</small></div>${i===S.stad?'<b>使用中</b>':i===S.stad+1?`<button class="btn" data-a="stad" ${S.cash<s[1]?'disabled':''}>${money(s[1])}</button>`:`<span class="mut">${money(s[1])}</span>`}</div>`});
  h+=`<div class="sec">お金の流れ</div><div class="card mut">本体で獲得したpt × $500 × 球場倍率が毎日入ります。勝利で当日収入の45%、敗北で10%の試合収入。年俸は毎週月曜に全員分を支払います。コーチ・施設は次の版で追加予定。</div>`;
  h+=`<div class="sec">データ</div><div class="card"><div class="mut">本体との同期：開始日 ${new Date(S.t0).toLocaleDateString()}　同期済み ${fmt(S.synced||0)}pt</div><div class="fb"><button data-a="reset">野球部をリセット</button></div></div>`;
  return h;
}
function render(){
  $('#hero').innerHTML=hero();
  $('#tabs').innerHTML=[['t','試合'],['p','選手'],['s','スカウト'],['b','球団']].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  $('#main').innerHTML=tab==='t'?vT():tab==='p'?vP():tab==='s'?vS():vB();
  $('#sheet').innerHTML=form?vF():'';
}
function mk(r,i){const p={id:uid(),name:r[0],pos:r[1],cls:r[2],sal:r[14],fund:r[15]*3.75,db:i,fat:0,ord:S.roster.length};
  if(r[1]==='B'){p.bal=r[3];p.st={m:r[4],p:r[5],r:r[6],a:r[7],f:r[8],c:r[9]}}else{p.role=starters().length<5?'SP':'RP';p.st={v:vOf(r[10]),k:r[11],s:r[12],b:Math.round(r[13]/24*255)}}
  return p}
const TWN=t=>t===2?'二刀流':'二刀流(控)';
function mkAll(r,i){const p=mk(r,i);if(!r[16])return [p];
  const o={id:uid(),name:r[0],pos:r[1]==='B'?'P':'B',cls:r[2],sal:0,fund:0,db:i,fat:0,ord:S.roster.length+1,twinOf:p.id,tw:r[16]};
  if(o.pos==='B'){o.bal=r[3];o.st={m:r[4],p:r[5],r:r[6],a:r[7],f:r[8],c:r[9]}}else{o.role=starters().length<5?'SP':'RP';o.st={v:vOf(r[10]),k:r[11],s:r[12],b:Math.round(r[13]/24*255)}}
  p.twin=o.id;p.tw=r[16];return [p,o]}
function reorder(id,dir){const p=S.roster.find(x=>x.id===id);const list=(p.pos==='B'?hitters():pitchers());const i=list.indexOf(p),j=i+dir;if(j<0||j>=list.length)return;[list[i].ord,list[j].ord]=[list[j].ord,list[i].ord];
  if(p.pos==='P'){const ps=pitchers();ps.forEach((q,k)=>q.role=k<5?'SP':'RP')}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=t.dataset.i;
  if(a==='tab')tab=i;
  else if(a==='open'){openSheet(i);return}
  else if(a==='close'){closeSheet();return}
  else if(a==='sc')S.sc=+i;
  else if(a==='up'||a==='dn'){reorder(i,a==='up'?-1:1);save()}
  else if(a==='tr'){const p=S.roster.find(x=>x.id===i),k=t.dataset.k,n=+t.dataset.n,c=costN(p,k,n);if(S.pt<c)return;S.pt-=c;p.st[k]=toIdx(k,Math.min(maxU(k),unitOf(k,p.st[k])+n));save();toast(`${p.name} ${k==='v'?PITN.v:(BATN[k]||PITN[k])} → ${disp(p.st,k)}`)}
  else if(a==='bal'){const p=S.roster.find(x=>x.id===i),c=costBal(p);if(S.pt<c||p.bal>=4)return;S.pt-=c;p.bal++;save()}
  else if(a==='role'){const p=S.roster.find(x=>x.id===i);p.role=p.role==='SP'?'RP':'SP';save()}
  else if(a==='swap'){const p=S.roster.find(x=>x.id===i);if(p.pos==='B'){p.pos='P';p.role=starters().length<5?'SP':'RP';p.st2=p.st;p.st=p.stP||{v:vOf(128),k:35,s:40,b:Math.round(3/24*255)}}else{p.pos='B';p.stP=p.st;p.st=p.st2||{m:35,p:30,r:35,a:30,f:30,c:30};p.bal=p.bal||2}p.ord=S.roster.length;save()}
  else if(a==='sell'){const p=S.roster.find(x=>x.id===i);if(!confirm(p.name+'を'+money(p.fund/2)+'で売却しますか？'))return;S.cash+=p.fund/2;S.roster=S.roster.filter(x=>x.id!==i&&x.id!==p.twin);S.bought=S.bought.filter(x=>x!==p.db);closeSheet();save();toast('売却しました')}
  else if(a==='rent'){const r=DATA.db[+i],f=r[15]*3.75/5;if(S.cash<f)return;S.cash-=f;S.bought.push(+i);const ps=mkAll(r,+i);ps.forEach(q=>{q.rent=addD(2);q.sal=0;q.fund=0});S.roster.push(...ps);S.log.unshift({d:dk(new Date()),t:'レンタル加入：'+r[0]+'（'+addD(2).slice(5).replace('-','/')+'まで）'});toast(r[0]+'をレンタル！（3日間）');if(tryMatch(dk(new Date()))){tab='t';toast('練習試合をしました！')}save()}
  else if(a==='buy'){const r=DATA.db[+i],f=r[15]*3.75;if(S.cash<f)return;S.cash-=f;S.bought.push(+i);S.roster.push(...mkAll(r,+i));save();toast(r[0]+'が入団！');if(tryMatch(dk(new Date()))){tab='t'}if(S.lv<=4){const need=RECRUIT[S.lv];if(heads()>=need)advance();save()}}
  else if(a==='stad'){const n=STAD[S.stad+1];if(!n||S.cash<n[1])return;S.cash-=n[1];S.stad++;save();toast(n[0]+'が完成！')}
  else if(a==='reset'){if(!confirm('野球部のデータを全部消します。よろしいですか？（本体のデータには影響しません）'))return;localStorage.removeItem('bb');init();return}
  render();
});
function init(){
  load();
  if(S)S.roster.forEach(p=>{if(p.db!=null&&DATA.db[p.db]&&!p.hero)p.name=DATA.db[p.db][0]});
  if(!S){
    const b=body();let name='タロウ';try{name=(b.set&&b.set.hero)||'タロウ'}catch(e){}
    S={t0:Date.now(),synced:0,pt:0,cum:0,cash:500000,lv:1,wins:0,lose:0,stad:0,rot:0,roster:[],bought:[],log:[],day:null,sc:0};
    S.roster.push({id:uid(),name,pos:'B',hero:true,dual:true,cls:'草野球',sal:0,fund:0,fat:0,ord:0,bal:2,st:{m:38,p:35,r:40,a:36,f:34,c:33},stP:{v:vOf(130),k:38,s:45,b:Math.round(4/24*255)}});
    S.log.unshift({d:dk(new Date()),t:'河川敷で'+name+'がひとり素振りを始めた'});
    save();
  }
  S.ts=S.ts||Math.floor(Math.random()*1e9);onOpen();
  daily();render();
}
init();
function openSheet(id){form={id};if(!(history.state&&history.state.sheet))history.pushState({sheet:1},'');render()}
function closeSheet(){if(history.state&&history.state.sheet)history.back();else{form=null;render()}}
window.addEventListener('popstate',()=>{if(form){form=null;render()}});
(()=>{let y0=null,dy=0,el=null;
  const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{el=e.target.closest('.fm');if(!el)return;const inHead=!!e.target.closest('.fmh');if(el.scrollTop>0&&!inHead){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null||!el)return;dy=e.touches[0].clientY-y0;if(dy>0){el.classList.add('drag');el.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null||!el)return;el.classList.remove('drag');if(dy>90){el.style.transform='translateY(100%)';setTimeout(closeSheet,150)}else el.style.transform='';y0=null;dy=0},{passive:true});
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();onOpen();daily();render()}});
</script>
