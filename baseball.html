<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>野球部 - ミッションクエスト</title>
<meta name="theme-color" content="#4a9fd8">
<style>
:root{--bg:#eef5e9;--card:#fff;--tx:#2a3a35;--mut:#6f8a80;--ac:#3f8fd2;--ok:#2fae8f;--bd:#a9d4c2;--dg:#d9534f;--y:#ffd23f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#152019;--card:#1e2c24;--tx:#e6f2ea;--mut:#8fb0a0;--bd:#33503f}}
:root[data-theme="dark"]{--bg:#152019;--card:#1e2c24;--tx:#e6f2ea;--mut:#8fb0a0;--bd:#33503f}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px 14px 60px}
a{color:var(--ac)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.ttl{font-weight:700;font-size:15px}
.bk{font-size:13px;text-decoration:none;border:2px dashed var(--bd);border-radius:10px;padding:4px 10px;background:var(--card)}
.hero{background:#2f7a4a;color:#fff;border-radius:18px;border:2px dashed #cfe8d8;padding:12px 14px;position:relative;overflow:hidden}
.hero .big{font-size:21px;font-weight:800;line-height:1.15;padding-right:130px}.hero small{font-size:11px;opacity:.9;display:block}
.hero .r{position:absolute;right:14px;top:10px;text-align:right;font-size:11px}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background:#c99a5b;border-top:2px solid #e8d9b0}
.tabs{display:flex;gap:5px;margin:12px 0}
.tabs button{flex:1;padding:9px 0;border:2px dashed var(--bd);background:var(--card);color:var(--mut);border-radius:14px;font:inherit;font-weight:600;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{display:flex;align-items:center;margin:16px 2px 6px;font-weight:700}.sec span{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:2px dashed var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:2px dashed var(--bd);border-radius:16px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.row .nm{flex:1;min-width:0}.row .nm small{display:block;color:var(--mut);font-size:11px}
.row b{color:var(--ac);white-space:nowrap}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:7px 11px;font:inherit;font-weight:700;font-size:13px}
.btn.s{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}.btn.g{background:var(--ok)}.btn.d{background:var(--dg)}
.btn[disabled]{opacity:.45}
.mut{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13px}
.stat{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 8px;align-items:center;font-size:13px;margin:4px 0}
.stat .b{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.stat .b i{display:block;height:100%;background:var(--ac)}
.stat .b i.star{background:var(--y)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--bd);color:var(--tx)}
.pill.y{background:var(--y)}.pill.r{background:#ffb3b3}
.sc{font-size:30px;font-weight:800;text-align:center;letter-spacing:2px}
.sc small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:0}
.lg{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}.lg:last-child{border:0}
.lg i{font-style:normal;color:var(--mut);font-size:11px;display:block}
.ord{display:flex;flex-direction:column;gap:2px}.ord button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;font-size:11px;padding:1px 5px}
.pg{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0 3px}.pg i{display:block;height:100%;background:var(--y)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:transform .25s;z-index:30;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20}
.fm{background:var(--card);border-top:2px solid var(--bd);box-shadow:0 -8px 30px rgba(0,0,0,.18);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto}
.fm h3{margin:0 0 8px;font-size:15px}
.fb{display:flex;gap:8px;margin-top:12px}.fb button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.fb .p{background:var(--ac);border-color:var(--ac);color:#fff}
.st2{padding:4px 0;border-bottom:1px dashed var(--bd)}.st2:last-of-type{border:0}
.st2 .hd{display:flex;align-items:baseline;gap:8px;font-size:14px}.st2 .hd b{font-size:15px}.st2 .hd .mut{margin-left:auto}
.st2 .b{height:9px;border-radius:99px;background:var(--bd);overflow:hidden;margin:3px 0 4px}.st2 .b i{display:block;height:100%;background:var(--ac)}.st2 .b i.star{background:var(--y)}
.tb{display:flex;gap:8px}.tb button{flex:1;min-height:29px;border:2px solid var(--ac);background:var(--card);color:var(--ac);border-radius:12px;font:inherit;font-weight:800;font-size:14px;line-height:1;padding:2px 0;touch-action:manipulation}
.tb button small{display:block;font-size:10px;margin-top:1px;font-weight:600;color:var(--mut)}
.tb button.bl{min-height:24px;flex-direction:row;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0}.tb button.bl small{display:inline;margin:0;font-size:11px}
.grab{width:44px;height:5px;border-radius:99px;background:var(--bd);margin:-6px auto 8px}
.fm{transition:transform .2s}.fm.drag{transition:none}
.fmh{position:sticky;top:-14px;margin:-14px -16px 0;padding:14px 16px 8px;background:var(--card);z-index:2;border-bottom:1px solid var(--bd)}.fmh h3{margin-bottom:4px}
.tb button:active{background:var(--ac);color:#fff}
.tb button[disabled]{border-color:var(--bd);color:var(--mut);opacity:.55}
.sv{display:flex;gap:5px}.sv button{flex:1;padding:7px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;font:inherit;font-size:12px}
.sv button[disabled]{opacity:.4}
#pop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#pop:empty{display:none}
.pp{background:var(--card);border:2px dashed var(--bd);border-radius:20px;padding:16px 18px;max-width:380px;width:100%;text-align:center}
.pp h4{margin:0 0 4px;font-size:17px}.pp .bigm{font-size:28px;font-weight:800;color:var(--ok);margin:6px 0}
.pp table{width:100%;font-size:13px;border-collapse:collapse;margin:8px 0}.pp td{padding:3px 2px;border-bottom:1px dashed var(--bd);text-align:left}.pp td:last-child{text-align:right;font-weight:700}
.pc{display:inline-block;border:1.5px solid var(--bd);border-radius:10px;padding:5px 8px;margin:3px 3px 0 0;font:inherit;font-size:12px;background:var(--bg);color:var(--tx)}
.pc[disabled]{opacity:.45}.pc small{display:block;font-size:10px;color:var(--mut)}
.seg{display:flex;gap:2px;margin:3px 0 4px}.seg i{flex:1;height:8px;border-radius:3px;background:var(--bd)}.seg i.on{background:var(--ac)}
</style>
</head>

5,101,106,103,103,null,null,null,null,10150000,20300000,0,1,"怪力",""],["黒鉄 テツ","P","メジャー",2,103,190,101,106,103,103,167,100,95,18,10150000,20300000,2,1,"二刀流の原石",""]],"story":{"1":{"w":"河川敷で{hero}がひとりで素振りを始めた。近所の草野球チームに『9人そろったら相手してやる』と笑われる。","m":["素振りを眺めていた釣り人の大塚さんが『昔は四番だった』と竿を置いた。2人目の仲間だ。"],"x":[],"c":"手書きのチラシと口コミで、ついに9人が河川敷に集まった。初期メンバー結成。"},"2":{"w":"試合は組めたが、グラブは3つ、バットは1本。商店街のおじさんズに『道具もなしで野球か』と呆れられる。","m":["大塚さんの物置から昭和のグラブが大量に発掘された。ただし革がカチカチだ。"],"x":[],"c":"おじさんズが店の倉庫から古いバットを寄付してくれた。道具がようやくそろった。"},"3":{"w":"大学サークルに『ユニフォームのないチームはグラウンドに入れられない』と言われた。学内規則らしい。","m":["布代を浮かそうと手作りに挑戦。背番号がすべて裏返しに縫われていた。"],"x":[],"c":"商店街の洋品店が格安で仕立ててくれた。初めてのユニフォームに袖を通す。"},"4":{"w":"市民球場の予約窓口にいたのは、対戦相手の市役所野球部の監督だった。『団体登録の書類不備です』と淡々と返される。","m":["会計係のなり手がおらず全員が目をそらす。キャプテンの大塚さんがしぶしぶ電卓を握った。"],"x":[],"c":"団体登録が通り、市民球場で初試合。帰りに『スポンサー募集』の貼り紙を作った。"},"5":{"w":"Cリーグ事務局『加盟には活動実績30日分の練習日誌が必要です』。河川敷チームに日誌なんてない。","m":["日誌をつけ始めた。『字が読めない』と二度突き返される。"],"x":[],"c":"日誌が受理され、Cリーグの加盟証が届いた。"},"6":{"w":"打ち上げの店をめぐって揉めた。『うちで飲まないなら試合は組まない』。","m":["商店街のおじさんズが仲裁に入り、店を交互に使う案がまとまりかける。"],"x":[],"c":"和解の乾杯。居酒屋ナインが公式戦の日程を受けてくれた。"},"7":{"w":"昇格審査で『グラウンド整備当番を3か月果たしていない』と指摘された。","m":["早朝のトンボがけを皆勤で続ける。漁協の人が干物を差し入れてくれた。"],"x":[],"c":"審査委員長が整備の行き届いた河川敷を見て、昇格を承認。"},"8":{"w":"サンダースの監督が『格下とはやらない』と対戦を拒否。","m":["地元のタウン誌に記事が載り、少しずつ名前が知られ始める。"],"x":[],"c":"記事を読んだサンダースから電話。『一度やろうか』。"},"9":{"w":"規約が変わり、『審判資格を持つ部員1名以上』が必須になった。","m":["誰が講習に行くかで揉めた末、キャプテンが受講することに。筆記で一度落ちる。"],"x":[],"c":"修了証が届き、Aリーグへの参加が正式に決まった。"},"10":{"w":"県大会の出場枠をめぐり、理事会の古参チームが『新参に枠はまだ早い』と反対。","m":["理事の一人がこっそり練習を見に来た。根回しが始まる。"],"x":[],"c":"理事会の採決で、1票差で出場枠を勝ち取った。"},"11":{"w":"社会人連盟への登録には『法人格』と『保証人』が要る。どちらもない。","m":["法人の書類づくり。定款の目的欄に『世界一』と書いて差し戻される。"],"x":[],"c":"法人登記が完了。房総信金の支店長が保証人を引き受けてくれた。"},"12":{"w":"スポンサー候補の会社に『実績のない球団に看板は出せない』と保留された。","m":["社長の息子が通う少年野球で、うちの選手が臨時コーチをしたことが社内で話題に。"],"x":[],"c":"ユニフォームの袖に初めてのスポンサーロゴが入った。"},"13":{"w":"遠征はメンバーの車5台に分乗。1台が成田で迷子になって遅刻し、連盟から『次は没収試合』と警告された。","m":["格安の中古バスを見つけた。ところが大型免許を持っている者がひとりもいない。"],"x":[],"c":"元路線バス運転手の徳さんが用具係として加入。遠征バスが走り出した。"},"14":{"w":"連盟から『観客の少ないチームは週末開催から外す』と通達。うちの応援席は家族の5人だけだ。","m":["商店街のおじさんズが会員第1号を名乗り出た。会員証は手書き、年会費は焼き鳥一本。"],"x":[],"c":"会員が100人を超え、ファンクラブが正式に発足した。"},"15":{"w":"河川敷の改修工事で、長年の練習場が半年使えなくなった。大会は待ってくれない。","m":["銚子の水産加工会社の社長が『うちの裏の空き地、魚くさくてよければ』と声をかけてくれた。"],"x":[],"c":"空き地を整備し、専用練習場が完成。風向きによっては干物の香りがする。"},"16":{"w":"試合終盤になると全員の足が止まる。相手の隊員に『合宿くらいやらないと』と言われるが、合宿費がない。","m":["隊員の一人が休日に自主トレを指導してくれた。翌日、全員が階段を降りられない。"],"x":[],"c":"房総信金の保養所を格安で借りられた。初のフィジカル強化合宿が実現。"},"17":{"w":"打球データを測る機器が欲しい。見積もりを見たら、球団の年間予算の3倍だった。","m":["八千代の工場の若手技術者が『試作品でよければ』と週末ごとに通い始めた。"],"x":[],"c":"技術者の会社が改良機を正式に貸与。最新分析ツールがベンチに並んだ。"},"18":{"w":"スポンサーを増やしたいが、地元企業の集まりに入る伝手がない。『紹介がないとね』と門前払い。","m":["支店長が商工会の新年会に連れて行ってくれた。{hero}が余興で素振りを披露し、拍手喝采。"],"x":[],"c":"新年会で集めた名刺の山から7社が協賛を決めた。地元企業の支援が一気に広がる。"},"19":{"w":"都市対抗予選の登録締切は明日。なのに申請書の書式が去年から変わっていて、全部書き直しだ。","m":["徳さんのバスで連盟事務所へ夜通し走る。窓口が閉まる1分前に滑り込んだ。"],"x":[],"c":"書類が受理され、予選を勝ち抜いた。都市対抗の本戦が見えてきた。"},"20":{"w":"プロ注目の大学生投手・佐伯に声をかけたが、『醤油会社の内定を断れない』と首を振られた。","m":["佐伯の祖母が{hero}の大ファンだと判明。週末ごとにお茶に招かれるようになる。"],"x":[],"c":"祖母のひと押しで佐伯が入団を決意。プロ注目の右腕が加わった。"},"21":{"w":"全国大会への出場には遠征費の前納が必要。積立金が20万円足りない。","m":["全員で物流倉庫の仕分けバイトに入る。{hero}だけ仕分けの速さが異様だった。"],"x":[],"c":"遠征費を納め、全国大会への初出場が正式に決まった。"},"22":{"w":"全国大会に出たのにテレビは素通り。『絵になる選手がいないと』とディレクターに言われる。","m":["タウン誌の小松記者が、手賀沼の野鳥と{hero}の素振りを並べた写真を撮った。"],"x":[],"c":"写真がネットで話題になり、テレビ局から取材依頼が相次いだ。"},"23":{"w":"スカウトが来るはずの日に雨天中止。次の視察予定は『未定』とだけ連絡が来た。","m":["雨の日も黙々と投げ込む佐伯の姿を、小松記者が記事にしてくれた。"],"x":[],"c":"記事を読んだスカウトが再来場。バックネット裏にスピードガンが並んだ。"},"24":{"w":"館山でキャンプを計画したが、観光シーズンで宿が全滅。予約サイトは真っ赤だ。","m":["民宿のおかみさんが『物置部屋でよければ』と。布団が足りず、全員で雑魚寝。"],"x":[],"c":"地元の少年野球と合同練習。キャンプ地での交流が毎年の恒例になりそうだ。"},"25":{"w":"大型商業施設が協賛を検討。条件は『施設のイベントに月2回出演』。選手は全員、昼は仕事がある。","m":["休みをやりくりして初のサイン会。来場者3人のうち1人は大塚さんの奥さんだった。"],"x":[],"c":"回を重ねるごとに行列が伸び、大型スポンサー契約が締結された。"},"26":{"w":"分析ツールのデータが山ほどたまったが、読める人がいない。監督はグラフを逆さに見ていた。","m":["電子部品メーカーを定年退職したデータ好きのミナミさんが、孫の応援ついでに手伝い始めた。"],"x":[],"c":"ミナミさんがアナリストに就任。データ野球が本格的に始まった。"},"27":{"w":"地域イベントを開きたいが、会場の許可が『農繁期は不可』。開催日がどこにも見つからない。","m":["稲刈りを手伝う代わりに、田んぼの一角を貸してもらう話がまとまった。"],"x":[],"c":"稲刈り後の田んぼで野球教室。新米おにぎり付きの地域密着イベントは大盛況。"},"28":{"w":"主力の故障が続く。医療法人に相談すると『まず全員の検査から』。検査費用の当てがない。","m":["非番の理学療法士が練習に来てくれた。全員の体の硬さに絶句していた。"],"x":[],"c":"医療法人との提携が決まり、スポーツ科学に基づくケア体制が整った。"},"29":{"w":"都市対抗本戦の直前、データを保存していたPCが壊れた。対戦相手の分析がすべて消える。","m":["ミナミさんが3日徹夜で手書きのスコアから復元。字が読めないのは日誌の頃と変わらない。"],"x":[],"c":"復元データが次々と的中。都市対抗ベスト4に名を連ねた。"},"30":{"w":"日本選手権の出場資格をめぐり、『草野球出身チームの出場は前例がない』と審議が長引く。","m":["審議の場に大塚さんが練習日誌の束を持参。1ページ目から読み上げ始めた。"],"x":[],"c":"出場が認められ、決勝を制した。社会人野球日本一だ。"},"31":{"w":"独立リーグ加盟には『ホームタウン自治体の後援』が必要。市役所の答えは『前例がありません』。","m":["あの市役所野球部の監督が課長に昇進していた。今度は書類の不備を一緒に直してくれる。"],"x":[],"c":"市の後援名義が下り、独立リーグへの加盟が承認された。"},"32":{"w":"元プロの内野手・久我に声をかけたが、『年俸が今の半分なら考える』。今の半分すら払えない。","m":["久我が河川敷にふらりと現れ、{hero}の素振りを黙って30分眺めて帰った。"],"x":[],"c":"『金じゃない、あの素振りだ』。久我の入団が決まった。"},"33":{"w":"市民球場は独立リーグの規格に足りない。新球場の候補地には、首を縦に振らない梨農家の畑がある。","m":["全員で梨の収穫を手伝う。{hero}が箱詰めの最速記録を塗り替えた。"],"x":[],"c":"農家が『外野に梨の木を一本残すなら』と同意。新球場の建設計画が動き出した。"},"34":{"w":"開幕から連敗。原因ははっきりしていて、長距離遠征続きで全員が寝不足だった。","m":["徳さんがバスの座席をフルフラットに改造。車内はいびきの大合唱。"],"x":[],"c":"ぐっすり眠って迎えた神奈川戦、ついに独立リーグ初勝利を挙げた。"},"35":{"w":"グッズを作りたいのに球団ロゴがない。案を募ったら、全員が別々の動物を描いてきた。","m":["ファンクラブの小学生が描いた『バットを持つ河川敷のカモ』が、なぜか圧倒的支持を集める。"],"x":[],"c":"カモのロゴ入りタオルが完成。グッズ販売の初日に完売した。"},"36":{"w":"リーグから『平均観客数が基準未満なら来季の主催試合を減らす』と警告が届いた。","m":["カモの着ぐるみを作ったが、中に入った大塚さんが熱中症寸前。急いで扇風機を内蔵する。"],"x":[],"c":"着ぐるみのカモ目当ての家族連れが急増。観客動員が基準を大きく上回った。"},"37":{"w":"地元テレビ局が中継を検討。条件は『中継車が入れる搬入路』。今の球場にはない。","m":["梨農家が畑の農道を開放してくれた。ただし収穫期の土曜だけは通行止め。"],"x":[],"c":"中継車が農道を抜けて到着。地元テレビ局で初の生中継が流れた。"},"38":{"w":"北陸遠征の費用が予算を大幅に超えた。バスの燃料代だけで徳さんが頭を抱える。","m":["クラウドファンディングを開始。返礼品『{hero}の素振り動画』が意外な人気を集める。"],"x":[],"c":"目標額を達成。支援者の名前を車体に書いたバスで北陸へ出発した。"},"39":{"w":"相手チームの元メジャーリーガーは今季出場を調整中。代理人に『無名球団との試合は見送りたい』と言われる。","m":["代理人がネットで{hero}の打撃動画を見つけ、本人に転送したらしい。"],"x":[],"c":"『彼と勝負したい』。元メジャーリーガーの出場が決まり、夢の対戦が実現した。"},"40":{"w":"首位争いの最中に雨天中止が続き、日程が過密に。ダブルヘッダーが3週連続で組まれた。","m":["投手が足りず、久我が20年ぶりにマウンドへ。山なりの球で3人を打ち取った。"],"x":[],"c":"過密日程を乗り切り、独立リーグ前半戦の優勝が決まった。"},"41":{"w":"四国アイランドリーグとの交流戦が決まった。ところが出発前日、徳さんのバスの車検切れが発覚。","m":["車検の間、選手は高速バスとフェリーに分かれて移動。佐伯だけ船酔いで青ざめる。"],"x":[],"c":"車検を通したバスが徳島で合流。四国遠征が本格的に始まった。"},"42":{"w":"佐伯の球速が伸び悩む。本人は『もう歳かな』と弱気だが、まだ25歳だ。","m":["ミナミさんのデータでフォームの癖が判明。香川のうどん屋で連日のフォーム談義。"],"x":[],"c":"佐伯が自己最速を更新。ドラフト候補として名前が挙がり始めた。"},"43":{"w":"スカウトが佐伯に興味を示すが、『契約書に移籍の条項がない』と交渉が止まった。","m":["契約書を作り直す途中、差し戻された定款の下書きが出てきた。『世界一』の文字にスカウトが笑う。"],"x":[],"c":"移籍条項を整え、スカウトとの交渉が正式なテーブルに乗った。"},"44":{"w":"優勝争いの終盤に故障者が続出。登録人数が規定を割り込み、試合不成立の危機に。","m":["高知で緊急の入団テスト。現れたのは、元カツオ漁師だという大男ひとり。"],"x":[],"c":"漁師上がりの代打が決勝打。四国リーグを制覇した。"},"45":{"w":"九州遠征の移動手段が決まらない。バスだと片道20時間、徳さんが『腰がもたん』とぼやく。","m":["フェリー案に落ち着くが、カモの着ぐるみが『手荷物か乗客か』で窓口と揉める。"],"x":[],"c":"着ぐるみは手荷物扱いで決着。九州遠征が始まった。"},"46":{"w":"地域貢献の表彰に推薦されたが、『活動記録が千葉のものばかり』と審査で保留になった。","m":["大分での試合後、温泉街のゴミ拾いを始めた。地元の子どもたちが勝手に合流してくる。"],"x":[],"c":"千葉と大分の両方から推薦状が届き、地域貢献活動の表彰が決まった。"},"47":{"w":"球団の規模が膨らみ、リーグから『運営会社の資本を増やすように』と求められる。もう個人の財布では限界だ。","m":["房総信金の支店長が退職金での出資を申し出た。条件は『試合の日は毎回ベンチ横の席』。"],"x":[],"c":"支店長が共同オーナーに就任。新体制の球団が船出した。"},"48":{"w":"北海道フロンティアリーグとの交流戦が決まった。だがフェリーの予約日付が1か月ずれていた。","m":["共同オーナーの支店長が旅行代理店に頭を下げに行く。ちゃっかり自分の席も確保。"],"x":[],"c":"苫小牧の港にバスが降り立った。北海道遠征の始まりだ。"},"49":{"w":"CS進出がかかる最終戦、士別の球場に季節外れの雪。中止なら勝率で他球団に抜かれてしまう。","m":["相手の選手も一緒になってグラウンドの雪かき。{hero}がトンボで雪を払う。"],"x":[],"c":"雪の晴れ間に試合が成立。勝って独立リーグCS進出を決めた。"},"50":{"w":"独立リーグ日本一決定戦の出場枠は各リーグ1つ。リーグ理事会が『創設3年未満の球団は推薦しない』と内規を持ち出した。","m":["房総信金の支店長が理事会に乗り込み、うちの3年分の練習日誌を机に積み上げる。字はまだ読みにくい。","推薦がまとまりかけた矢先、選抜チームの監督が『{hero}を選抜に貸してくれ』と引き抜きを打診してきた。"],"x":["河川敷時代から通う焼き芋屋のおじさん、今季から球場の外で屋台を出す。『日本一になったら一本タダ』。"],"c":"{hero}本人が『うちで勝ちたい』と即答。推薦が通り、選抜を破って独立リーグ日本一を達成した。"},"51":{"w":"NPBファーム参入審査委員会の鷲尾委員長『河川敷出身？ 前例がありませんね』。審査書類は電話帳ほどの厚さだった。","m":["球団事務の小松さんが徹夜で書類を埋める。『本拠地球場』の欄で手が止まる。河川敷とは書けない。","千葉市内の古い市営球場を借りる話がまとまりかけた矢先、照明設備がファームの基準に1ルクス足りないと判明。"],"x":["新マスコット『カワラん』の着ぐるみが届く。頭が大きすぎて、球場の通路で毎回つっかえる。"],"c":"商店街のおじさんズが投光器を持ち寄り基準をクリア。鷲尾委員長の判子が押され、NPBファーム参入が決まった。"},"52":{"w":"ファーム公式戦の開幕カード。だが用具の公式規格チェックで、うちのバットの半分が不合格に。","m":["用具係のタケさんが全国のメーカーに電話をかけまくる。在庫が見つかったのは北海道の倉庫だけ。","フェリーで運ぶ手配がついた矢先、大雪で港が閉鎖。タケさんが『陸路で行く』と軽トラで出発した。"],"x":["{hero}、新潟遠征で食べたへぎそばに感動し、ロッカーに『そば打ち道具』を持ち込んで怒られる。"],"c":"試合開始1時間前、雪まみれの軽トラが到着。新しいバットで打ち勝ち、ファーム公式戦初勝利を挙げた。"},"53":{"w":"伝統球団の二軍戦はチケットが即完売。だが『新参球団のビジター応援席は用意できない』と告げられる。","m":["小松さんが先方の営業担当と交渉。『応援団の人数と鳴り物の種類を書面で』と宿題が出る。","書類がまとまりかけた矢先、うちの応援団長が『鳴り物はフライパン』と書いて提出してしまった。"],"x":["焼き芋屋のおじさん、東京遠征にも屋台ごとついてきた。球場前で売り切れて、なぜか先方ファンに感謝される。"],"c":"フライパンは不許可、でもメガホンならOK。小さな応援席が認められ、伝統球団との初対戦が実現した。"},"54":{"w":"関西遠征の宿が取れない。同じ週に大きな学会があり、球場周辺のホテルが全滅していた。","m":["スカウトの丸茂さんが昔なじみの民宿に頭を下げる。『布団は12組しかないで』。","雑魚寝でしのぐ案がまとまりかけた矢先、民宿のおかみが『うちは虎党やから、明日は負けてな』と釘を刺す。"],"x":["丸茂さん、40年スカウトをやって初めて『自分の球団』のユニフォームを着た。鏡の前でしばらく動かなかった。"],"c":"おかみの晩ごはんで全員が完全復活。試合では猛虎打線と真っ向勝負を演じ、拍手で送り出された。"},"55":{"w":"選手会の新人研修に出ろ、と通達。ただし受講しないとファームの公式戦に出られない。日程は試合と丸かぶりだった。","m":["研修の振替日を探して事務局と10往復。小松さんのメールの件名が『再々々々確認』になっていく。","振替が決まりかけた矢先、研修中の居眠りで{hero}が追試に。講師は『プロの洗礼ですね』と笑った。"],"x":["カワラん、埼玉の球場で相手マスコットに一礼したら、頭が外れて転がっていった。拍手が起きた。"],"c":"追試を満点で通過。翌日の試合ではプロの球の速さに面食らいながらも、最後まで食らいついた。"},"56":{"w":"交流戦のチケットを地元商店街に配ったら、主催側の『招待券は事前申請』の規約に引っかかった。","m":["おじさんズが一人ずつ申請書を手書き。全員の字が日誌と同じくらい読めない。","受理されかけた矢先、申請者の一人が『横浜ファン歴40年』と判明。『どっちを応援するんですか』と問われる。"],"x":["横浜の港で、{hero}が釣り人に『いい肩してるね』とルアーの遠投を頼まれる。新記録が出たらしい。"],"c":"『両方』と答えたおじさんに担当者が笑い、申請は全部通った。満員のスタンドで交流戦が始まった。"},"57":{"w":"投手陣が足りない。ファーム規定の登録人数に3人届かず、このままでは連戦が組めない。","m":["丸茂さんが社会人時代のライバル球団のエースに声をかける。『会社を辞める度胸がない』と断られる。","一度は断ったエースから電話。来てくれる話がまとまりかけた矢先、彼の勤務先が『送別会を3回やらせろ』と条件を出した。"],"x":["名古屋遠征で全員が手羽先を食べすぎ、翌朝の体重測定で球団史上最大の『重さ』を記録した。"],"c":"送別会を3回こなしたエースが合流。新人2人も加わり、投手陣の強化が正式に完了した。"},"58":{"w":"育成契約で獲った若手が『支配下登録』されないまま出場できない。登録枠の空きがないのだ。","m":["鷲尾委員長に枠の相談。『規約第14条の但し書きを読みましたか』と分厚い冊子を渡される。","但し書きで枠が開けそうになった矢先、ベテランの捕手が『俺が育成に戻る』と言い出し大揉めに。"],"x":["育成の若手、寮の自室に『目標：一軍』と書いた紙を貼る。翌朝、誰かが横に『カワラんも』と書き足していた。"],"c":"ベテランの申し出は丁重に却下。但し書きで枠が開き、育成出身の若手が初打席で決勝打を放った。"},"59":{"w":"同じ千葉の球団との対戦。地元テレビが『どっちが千葉の顔か』と煽り、球場使用の調整が紛糾した。","m":["小松さんが両球団の広報と三者会談。議題の半分が『どちらのマスコットが前に立つか』だった。","日程がまとまりかけた矢先、ローカル番組の生放送で{hero}が『千葉はうちのもん』と口を滑らせた。"],"x":["柏駅前で{hero}がサインを求められる。差し出されたのは小学生の算数ドリル。丸をつけてあげた。"],"c":"翌日の番組で『千葉はみんなのもん』と訂正し、なぜか好感度が上がる。試合で一軍スカウトの目を引いた。"},"60":{"w":"首位争いの直接対決を前に、雨天中止が3試合続いて日程が詰まった。ダブルヘッダーの申請が必要だ。","m":["申請書の提出期限は明日正午。小松さんがコンビニのFAXの前で夜明けを迎える。","受理されかけた矢先、相手球団からも同じ日に別の振替案が出て、事務局が『どちらか一方で』と困り果てる。"],"x":["雨の日、選手たちが室内練習場でカワラんに打撃投手を頼む。意外にストライクが入る。"],"c":"両案を合体させた日程が通り、ダブルヘッダーを連勝。ついにファーム首位争いに名乗りを上げた。"},"61":{"w":"東北遠征のバスが手配できない。大型バスの運転手不足で、どこの会社も首を横に振った。","m":["タケさんが大型免許を持っていたことが判明。『ただし20年ぶりだ』。","教習所で勘を取り戻しかけた矢先、バスの車高が球場の駐車場ゲートより5センチ高いと分かった。"],"x":["仙台で{hero}が牛たんを10人前。店主が色紙に『また来い、大食い』と書いてくれた。"],"c":"球場の職員さんが別の搬入口を開けてくれた。タケさんの安全運転で、東北遠征が無事に始まった。"},"62":{"w":"北の強豪の二軍が千葉に来る。だが若手が躍動する相手の勢いに、うちのスタメン表が決まらない。","m":["監督会議が深夜まで続く。丸茂さんは相手の若手全員の映像を3周見ていた。","打順がまとまりかけた矢先、{hero}が『1番から9番まで全部やりたい』と言い出して振り出しに戻った。"],"x":["地元の少年野球チームが練習見学に来る。帰り際、全員がカワラんの頭を順番になでていった。"],"c":"{hero}は4番に収まり、スタメン表は朝5時に完成。若い勢いの相手と互角に打ち合った。"},"63":{"w":"山口での合同キャンプ参加には『練習メニューの事前提出』が必要。うちのメニューは『とにかく走る』だけだった。","m":["新加入のエースが社会人時代のメニューを持ち込み、書類の体裁は整う。","提出しかけた矢先、合宿所の食堂が『大食いの球団は困る』と食数制限を言い渡してきた。"],"x":["キャンプ地の朝、{hero}が海岸を走っていると、地元のおばあちゃんがみかんを投げてくれる。全部キャッチした。"],"c":"米を自前で持ち込むことで食堂と和解。早朝から日没までの猛練習が、そのまま試合での粘りになった。"},"64":{"w":"三軍まで抱える大所帯の相手に、うちは選手が足りず練習試合すら組めない。『まず三軍とどうぞ』と言われる。","m":["三軍戦に勝ち越し、二軍戦への道が見えてくる。小松さんが勝敗表を毎日更新する。","二軍戦の承認が出かけた矢先、うちの捕手2人が同時に指を負傷。登録できる捕手がいなくなった。"],"x":["福岡の屋台で、丸茂さんが昔スカウトし損ねた選手と再会。今は屋台の大将で、ラーメンを一杯おごってくれた。"],"c":"ベテラン捕手が痛み止めを手に復帰を志願。厚い選手層の壁を越え、二軍戦への出場が正式に認められた。"},"65":{"w":"ファーム日本選手権の出場資格に『参入初年度の球団は観客動員の実績を示せ』という条件があった。","m":["焼き芋屋とおじさんズが動員作戦を立案。『一人十人連れてくる』が合言葉になる。","目標に届きかけた矢先、決戦当日に台風予報。チケットの払い戻し問い合わせが殺到した。"],"x":["カワラんの中の人が初めて明かされる。河川敷時代からのファンの大学生だった。誰にも言っていない。"],"c":"台風が逸れた朝、球場は満員。出場が認められ、代表を破ってファーム日本一を達成した。"},"66":{"w":"一軍昇格の申請に、NPB実行委員会の全会一致が要る。ある古参オーナーが『時期尚早』と首を縦に振らない。","m":["鷲尾委員長が非公式に助言。『あの方は、昔は草野球の人だったんですよ』。","古参オーナーとの面会が決まりかけた矢先、雑誌に『河川敷球団、一軍は無謀』という匿名コラムが載った。"],"x":["{hero}、一軍用の新しいスパイクを買ったが、河川敷時代のボロボロの方が落ち着くとこっそり履き替えた。"],"c":"古参オーナーは河川敷時代の写真を見て黙って判を押した。一軍昇格が決定し、北の大地で開幕戦を迎えた。"},"67":{"w":"一軍の連敗が止まらない。スポンサーの房総信金にも『契約見直し』の声が本店から届き始めた。","m":["支店長が本店に呼ばれる。帰り道、『あと3試合は俺が預かる』とだけ電話してきた。","流れが変わりかけた矢先、エースが登板前日にぎっくり腰。先発がいない。"],"x":["連敗中、焼き芋屋のおじさんが球場前で『負けても一本サービス』を始める。行列が過去最長になった。"],"c":"育成出身の若手が緊急先発で7回無失点。ウイニングボールは支店長に届けられ、プロ初勝利となった。"},"68":{"w":"交流戦の放映権をめぐり、中継局が『無名球団の試合は枠がない』と難色。中継なしでは協賛金が入らない。","m":["小松さんがネット配信を企画。カメラは選手の家族から借りた家庭用ビデオ3台。","配信の準備が整いかけた矢先、名古屋の球場で回線が不安定に。画面が5秒ごとに固まる。"],"x":["名古屋の味噌カツを食べた{hero}、『これを打ち上げの店に教えたい』と居酒屋ナインの大将に電話した。"],"c":"カクカクの配信が逆に話題になり、中継局が後半から生放送を決定。セ・パ交流戦が正式に幕を開けた。"},"69":{"w":"東京の夜の試合で、観客席を『外野芝生を開放してほしい』とファンが要望。主催側は前例がないと渋る。","m":["おじさんズが署名を集める。河川敷の芝で観戦していた頃の写真が添えられていた。","要望が通りかけた矢先、雷雨予報で試合自体の開催が危ぶまれる。グラウンド整備の人手が足りない。"],"x":["丸茂さんが神宮の外苑を散歩。若い頃に見た試合の話を、カワラんに延々と聞かせていた。"],"c":"選手とファン総出で水を掻き出し試合開始。夜空の下、延長戦までもつれる熱戦を繰り広げた。"},"70":{"w":"所沢遠征の直前、バス会社が『一軍の移動は大型二台が規定』と言い出す。うちの球団にはマイクロバスが一台きり。","m":["房総信金の支店長に頭を下げ、大型バスのリース契約がまとまり始める。","判を押す寸前、二台目の運転手が『山道は苦手』と辞退。代わりに名乗り出たのは、大型免許を持つ{hero}の父だった。"],"x":["マスコットのカワラちゃん、屋根付き球場を見上げて『雨でも練習できる』と感涙。中の人は汗だく。","{hero}、森に囲まれた球場で野鳥観察にハマり、打撃練習に遅刻しかける。"],"c":"大型バス二台がそろい、所沢へ出発。獅子おどし打線との真っ向勝負が始まった。"},"71":{"w":"広島遠征の宿が取れない。街じゅうの宿が、赤いユニフォームの客で埋まっている。","m":["広報の佐倉さんが民泊を片っ端から当たり、三軒の約束を取り付ける。","まとまりかけた矢先、一軒が『他球団の客はお断り』。だが女将の息子が{hero}のファンで、こっそり母を説得してくれた。"],"x":["お好み焼き屋で、大食いの外野手が『もう一枚』を六回言い、店主に名前を覚えられる。","赤一色のスタンドに、ぽつんと一本だけうちの球団の旗。河川敷時代から通う少年が振っていた。"],"c":"全員分の宿がそろい、選手たちは赤ヘル旋風のど真ん中へ乗り込んだ。"},"72":{"w":"千葉同士の対戦に、県の架空の観光委員会が『千葉ダービー』の冠イベントを提案。協賛の取り合いで日程が決まらない。","m":["商店街のおじさんズと地元企業が同じテーブルにつき、協賛の分け方を話し合う。","合意寸前、両球団のマスコットが同じ日にCM撮影を入れていたと判明。カワラちゃんが撮影を譲り、場が一気に和んだ。"],"x":["海風が強すぎて、{hero}のフライが二度戻ってきた。本人いわく『ブーメラン打法』。","河川敷でグラウンド整備をしてくれていたおばあちゃんが、初めてプロの球場に来てくれた。"],"c":"『千葉ダービー』の開催が正式決定。マリンの風の中、プレーボールがかかった。"},"73":{"w":"試合前のホームラン競争に招待が来た。だが内規は『本塁打10本以上』。{hero}はまだ9本。","m":["{hero}、二軍時代の打撃コーチと居残り特打。夜の練習場に照明がいつまでも灯る。","10本目を打った翌日、架空の記録委員会が『フェンス直撃は二塁打』と訂正。だがその夜、11本目が場外へ消えた。"],"x":["中華街で肉まんを二十個買った選手、バスで全部食べて試合前の体重計で青ざめる。","球場の外で、うちの応援歌を練習する大学生に遭遇。歌詞が勝手に三番まで増えていた。"],"c":"ホームラン競争への出場が決定。ハマスタの夜空に{hero}の名前がこだました。"},"74":{"w":"新加入球団の一軍1年目は、上位球団との対戦前に架空の『戦力均衡審査会』の面談が必要だと通達が来る。","m":["監督が審査会で三時間熱弁。『河川敷から来ました』の一言で、委員が一人だけ笑った。","通過目前、委員長が『年俸資料が手書きだ』と差し戻し。佐倉さんが一晩で表計算に打ち直し、逆に褒められた。"],"x":["たこ焼き屋で一個おまけをもらった{hero}、律儀にお礼の手紙を書く。ちゃんと返事が来た。","カワラちゃん、大阪のファンにツッコミを求められて固まる。三日後、ノリツッコミを習得した。"],"c":"審査会の承認が下りた。パ・リーグ覇者への挑戦状が、正式に受理された。"},"75":{"w":"東京ドームのチケット割り当てで、うちの発券担当が入力を一桁ミス。応援団の席が全部『立ち見』になっていた。","m":["佐倉さんがチケット会社に日参し、少しずつ指定席への振り替えが進む。","振り替え完了の直前、応援団が『ドームで太鼓は鳴らせるのか』と大騒ぎ。規約を読み込み、鳴り物の許可枠をなんとか確保した。"],"x":["{hero}、バックスクリーン裏で迷子になり、警備員さんと世間話をしてから戻ってくる。","スカウトの古賀さん、売り子の投げ渡しを見て『肩がいい』と真顔で入団テストを勧め、丁重に断られる。"],"c":"応援団の席がそろった。東京ドームの大歓声が、三塁側まで揺らした。"},"76":{"w":"甲子園は高校野球の期間中。代替日程を決める架空の『夏季日程調整会議』が紛糾して決まらない。","m":["監督が会議に出向き、『高校球児が優先で当然です』と頭を下げた。空気が少し変わる。","再調整案がまとまりかけた矢先、台風が近畿を直撃。だが台風一過、ちょうど一日だけ空き日が生まれた。"],"x":["{hero}、甲子園の土を持ち帰ろうとして先輩に止められる。『お前はもう高校生じゃない』。","若手投手が初めて甲子園のマウンドに立ち、実家に電話。母のほうが先に泣いていた。"],"c":"空き日に試合が組まれた。甲子園の熱気が、うちの球団を丸ごと包み込んだ。"},"77":{"w":"CS進出が懸かる終盤、エース格の投手が登録日数の規定に一日足りず、一軍登録できないと判明。","m":["事務方が過去の登録記録を洗い直し、雨天中止日の扱いに望みを見つける。","申請が通りかけた矢先、別の投手が食あたりで離脱。だがファームで育った若手が『いつでも行けます』と名乗り出た。"],"x":["ファーム時代に世話になった福岡の屋台の大将が、一軍のスタンドで『やっと来たか』と笑う。","カワラちゃん、ドームの屋根が開くと聞いて一日中見上げていた。その日は開かなかった。"],"c":"雨天中止日の算入が認められ、エースが復帰。リーグ3位以内を確保し、CS進出権を手にした。"},"78":{"w":"CSの中継をめぐり、新規球団のうちだけ『ポストシーズン放映契約』が未整備。出場に待ったがかかる。","m":["地元ケーブル局と交渉。『河川敷時代の映像もつけます』の一言で、相手が身を乗り出す。","仮契約の直前、全国中継の権利と重複すると指摘が入る。結局ケーブル局は『副音声で千葉弁実況』という独自枠に落ち着いた。"],"x":["寮の洗濯機が壊れ、CS期間中はユニフォームを手洗い。なぜかチームワークが深まる。","古賀スカウト、相手の応援歌を三曲覚えてしまい、ベンチ裏で口ずさんで総スカンを食らう。"],"c":"放映契約がまとまり、出場が確定。前哨戦を突破して、ファイナルへ駒を進めた。"},"79":{"w":"ファイナル直前、{hero}が監督の采配に納得できず口を閉ざす。ロッカールームに亀裂が走る。","m":["主将が{hero}を河川敷へ連れ出し、昔のようにノックを打つ。二人とも黙って汗を流した。","和解しかけた夜、週刊誌が『内紛』と書き立てる。だが記事を読んだ全員が笑い出し、逆に結束が固まった。"],"x":["監督の奥さんの差し入れ、おにぎりの具が全部梅干し。『勝負は酸っぱいものよ』。","寮の食堂のおばちゃん、CS中だけ献立に『かつ』を入れ続ける。カツ丼、串カツ、かつお。"],"c":"{hero}と監督が並んでベンチへ。ファイナルを制し、日本シリーズ進出が決まった。"},"80":{"w":"日本シリーズを前に、うちの本拠地が『収容人数不足』と判定される。このままではホームゲームが開けない。","m":["房総信金と商店街が奔走し、仮設スタンドの建設が始まる。","完成間近、消防検査で避難通路が足りないと指摘。徹夜の工事に、河川敷時代のOBたちが駆けつけた。"],"x":["シリーズ中、{hero}の実家の電話が鳴りやまない。父は『本人は寝てます』を百回言った。","カワラちゃん、祝賀用の新衣装を発注。サイズを間違えて頭しか入らなかった。"],"c":"仮設スタンドが検査に合格し、本拠地で胴上げ。日本一の夜、{hero}が『次はアメリカです』と宣言した。"},"81":{"w":"メジャー挑戦にはMLB球団との提携とビザが要る。うちの球団には提携先も、アメリカの弁護士もいない。","m":["通訳兼交渉役にケン・タナベを雇う。最初の英文メールで『球団』の訳に一時間悩んだ。","ある球団との提携がまとまりかけた矢先、ビザ面接が三か月先と判明。だが毎朝キャンセル待ちに並んだケンが、翌週の枠をつかんだ。"],"x":["渡米前夜、商店街のおじさんズが壮行会。餞別は千葉の落花生10キロ。税関を全員が心配した。","{hero}、英語の自己紹介を練習しすぎて、寝言まで『Nice to meet you』。"],"c":"ビザが下り、提携先とのマイナー契約に署名。チームはラスベガス行きの飛行機に乗り込んだ。"},"82":{"w":"3Aの登録枠は提携先が握っている。うちの選手は『様子見』扱いで、半分がベンチ外に回された。","m":["ケンが毎日、提携先のファーム責任者に試合映像を送り続ける。","枠が増えかけた矢先、メジャー落ちのベテランが大量に降りてくる。だがその一人、ルイスが{hero}のスイングを見て『こいつを使え』と口添えした。"],"x":["球場メシはホットドッグばかり。大食いの外野手は一日八本食べ、『落花生が恋しい』とつぶやく。","マイナーの給料明細を見た若手、『河川敷時代のバイト代と変わらない』と妙に落ち着く。"],"c":"全員がロースター入り。洗礼を浴びながら、うちの球団の野球が3Aで動き出した。"},"83":{"w":"標高の高いソルトレイクで投手陣が息切れ。チームドクターが『順化に二週間』と登板を止める。","m":["ケンが酸素カプセルのレンタルに奔走。見積もりを見た監督が卒倒しかける。","順化が進んだ矢先、今度は{hero}が打球の飛びすぎで感覚を崩す。ルイスの『風船を打つと思え』という謎の助言が、なぜか効いた。"],"x":["遠征先のモーテルで、ルイスが初めて日本語を覚えた。『おかわり』。","現地の子どもがカワラちゃんの写真を見て『これはカエル？』。説明に二十分かかった。"],"c":"ドクターのOKが出た。薄い空気の中、うちの投手陣が九回を投げ切った。"},"84":{"w":"オクラホマへはバスで十八時間。ところがバス会社が『外国籍チームの保険』を理由に予約を保留した。","m":["ケンが保険会社に電話をかけ続け、英文の書類が一枚ずつそろっていく。","保険が下りかけた矢先、バスのエアコンが故障。代わりに来たのは黄色いスクールバスで、選手たちはなぜか遠足気分で盛り上がった。"],"x":["十八時間のバスで{hero}が日記を三十ページ書く。後半はほぼ『まだ着かない』。","途中のガソリンスタンドの店主が、昔日本に住んでいたと判明。手作りのおにぎりを持たせてくれた。"],"c":"保険の承認が下り、バスがオクラホマに到着。長旅の疲れごと、相手打線を抑え込んだ。"},"85":{"w":"提携先のメジャー球団が、うちの試合への視察を『優先度が低い』と後回しにしている。","m":["古賀スカウトが自費で渡米し、提携先のスカウト陣に{hero}の資料を手渡しで配って回る。","視察が決まった矢先、当日に砂嵐が来て中止の危機。だが一時間遅れで始まり、視察陣はむしろ最後まで見ていった。"],"x":["カジノ街のホテルで、スロットの音が一晩中響く。選手たちは耳栓を一組ずつ分け合った。","古賀スカウト、牧場で馬の調教師に『肩がいい』と声をかけ、またも丁重に断られる。"],"c":"視察が実現した。{hero}の名前が、メジャー昇格候補のリストに書き込まれた。"},"86":{"w":"気温四十度超え。リーグが『熱中症対策の計画書』を出さない球団の試合は延期すると通達した。","m":["日本から佐倉さんが計画書の雛形を送り、ケンが英訳。ページ数がどんどん増えていく。","提出直前、『氷の調達先』が空欄だと差し戻し。すると地元のかき氷屋が名乗り出て、試合中ずっと氷を運んでくれることに。"],"x":["BBQ店の大皿に挑んだ大食いの外野手、ついに完食。店の壁に写真が貼られた。","{hero}が日本から届いたうちわを配る。描かれた河川敷の絵に、チームメイトが『ここはどこだ』と興味津々。"],"c":"計画書が受理され、試合決行。テキサスの猛暑の中、最後まで足が止まらなかった。"},"87":{"w":"{hero}がオールスターのファン投票で上位に入った。だが提携先の推薦枠は別の選手に回され、出場が危うい。","m":["日本のファンが現地の投票サイトに殺到。ケンが『時差に気をつけて』と告知を流す。","逆転しかけた矢先、重複投票を疑われ一部の票が無効に。だがルイスが記者に『こいつの打撃は本物だ』と語り、風向きが変わった。"],"x":["気球祭りの街で、カワラちゃん型の気球を作ろうと盛り上がる。見積もりを見て全員が黙った。","オールスター前夜、{hero}が日本の母に電話。会話は『ちゃんと野菜食べてる？』で終わった。"],"c":"監督推薦での選出が正式決定。マイナーリーグオールスターのグラウンドに{hero}が立った。"},"88":{"w":"プレーオフ争いの最中、提携先がうちの主力投手をメジャーへ引き上げると通告してきた。","m":["監督が提携先に掛け合い、『プレーオフまで残してほしい』と食い下がる。","交渉は平行線のまま、引き上げの日が来た。だが彼がメジャー初登板で好投し、提携先が『代わりに有望株を二人送る』と申し出た。"],"x":["国境の街のタコスで、{hero}が辛さに水を三回おかわり。ルイスが『おかわり』を正しく使えて大喜び。","日本の商店街から、プレーオフ祈願の千羽鶴が届く。航空便の送料が鶴より高かった。"],"c":"新戦力がすぐに噛み合い、白星を重ねた。3Aプレーオフ進出が決まった。"},"89":{"w":"決勝の地タコマへ向かう直前、{hero}のビザの滞在期限が試合期間中に切れると判明した。","m":["ケンが更新申請を出し、監督は毎朝郵便受けをのぞき込む。","承認目前、書類の名前のつづりが一文字違うと差し戻し。ケンが夜通し車を走らせ、窓口が開くと同時に訂正を出した。"],"x":["雨のタコマで、ルイスが『日本の河川敷もこんなに雨が降るのか』と聞く。{hero}は『泥はもっと多い』と答えた。","日本では商店街の居酒屋でパブリックビューイング。おじさんズは朝五時から乾杯していた。"],"c":"更新ビザが届き、{hero}は決勝のグラウンドへ。3A優勝の歓喜の中、メジャー昇格の電話が鳴った。"},"90":{"w":"メジャー昇格が決まったのに、全員のビザが3A用の区分のまま。移民局「区分変更には最低6週間」。","m":["弁護士事務所に書類を山ほど持ち込む。通訳のケンジが徹夜で全員分の経歴書を英訳した。","審査が進みかけた矢先、{hero}の職歴欄「河川敷」が地名か職業かで照会が入る。ケンジが写真付きで説明に走る。","担当官が千葉の河川敷の写真を見て一言。「ここから来たのか。特急で回そう」。"],"x":["オークランドの空港で{hero}のバットケースが行方不明。代わりに届いたのは、誰かのボウリングの球。","外野席でドラムを叩く常連のおじさんが、試合前に{hero}へスティックを一本くれた。お守りらしい。"],"c":"ビザの区分変更が承認された。オークランドの空の下、メジャーデビュー戦のメンバー表が提出される。"},"91":{"w":"機構の新規参入審査委員会が、うちの正式加盟の票決を保留。古参オーナーのボルドウィン氏が「実績不足」と反対している。","m":["委員長のハロウェイ氏と面談。「票は割れている。数字より、君たちの物語を見せてくれ」。","説得が進みかけた矢先、ボルドウィン氏が「河川敷の球団に高地デンバーは無理」と公開書簡。それが話題になり、試合のチケットが完売する。","完売の報を受け、中立だったオーナー二人が賛成に回った。"],"x":["標高1600m。ブルペン捕手が「空気が薄い」と酸素缶を買い込み、なぜか売店の人に配って歩いた。","デンバーのホテルで、{hero}が厨房から高地仕様のパンケーキの焼き方を教わってきた。"],"c":"加盟票決が賛成多数で可決。打球がよく伸びるクアーズで、本当の洗礼が始まった。"},"92":{"w":"選手会が「うちの選手の年俸体系がメジャーの最低保障を下回る」と指摘。是正までは試合登録を認めないという。","m":["給与表を総点検。河川敷時代から残る「現物支給：おにぎり」の欄を消すところから始めた。","原資の目処が立った矢先、選手会の担当者が「おにぎりも福利厚生として評価したい」と言い出し査定がやり直しに。ただ距離は一気に縮まった。","千葉の房総信金から追加融資の連絡。支店長「ここまで来たら、最後まで付き合いますよ」。"],"x":["シカゴのホットドッグにケチャップをかけようとしたら、隣の客に真顔で止められた。","{hero}の母から国際小包。中身は湿布と、商店街のおじさんズの寄せ書き。"],"c":"選手会が登録を承認。シカゴの夜空に、{hero}のメジャー初ホームランが消えていった。"},"93":{"w":"ハリケーン接近で遠征便が全便欠航。代替日程を組む機構の日程委員会は、うちの試合を「後回し」にした。","m":["広報の佐倉がチャーター便を探して電話をかけまくる。見つかったのは貨物便の空きスペースだけ。","貨物便案がまとまりかけた矢先、用具の重量オーバーが発覚。全員が私物を減らし、{hero}は愛用の枕を置いていく決断をした。","日程委員会から回答。「自力で来られるなら枠を空ける」。マイアミのクラブハウスの鍵が開いた。"],"x":["ホテルのプールで救援投手陣がシンクロを結成。キャプテンは一番泳げない男だった。","球場前でキューバ系の老人がコーヒーをおごってくれた。「甘すぎる」と言ったら、もう一杯出てきた。"],"c":"嵐の去ったマイアミで試合が成立。フロリダ遠征、全員そろって完走。"},"94":{"w":"球界の顔と呼ばれる相手の強打者は、このカード休養予定と発表。先方の編成担当「無名球団相手に無理はさせない」。","m":["現地の日本人ファンが署名を集め始めた。「あの人と{hero}の対決が見たい」。","署名が千を超えた矢先、先方が「芝の張り替え直後で足元が不安」と難色。うちの選手たちが河川敷仕込みのグラウンド整備を申し出る。","整えられた芝を見た強打者本人が、監督室のドアを叩いたらしい。"],"x":["球場前の巨大な帽子のオブジェで全員の記念写真。一人だけ、自分の帽子を逆にかぶっていた。","近くのテーマパークに行った若手が、パレードの振り付けを完コピして帰ってきた。"],"c":"当日のスタメン表に、あの名前があった。{hero}との対決は、9回二死で訪れる。"},"95":{"w":"ある連邦議員が「外国資本の球団が国民的娯楽に参入」と公聴会を要求。オーナーの出席が求められた。","m":["想定問答づくり。ケンジが「河川敷」を「リバーサイド・フィールド」と訳し、急におしゃれになる。","答弁が固まりかけた矢先、議員事務所が「球団の歩みを示す資料」を追加要求。千葉から段ボール十箱分の練習日誌が空輸される。","公聴会当日。議員は日誌を一冊めくり、「字が読めない」とだけ言って笑った。"],"x":["記念塔の前をランニング中の{hero}が観光ガイドと間違えられ、三組を案内してしまった。","名物の着ぐるみ競走に、うちのマスコットが乱入。失格だったが、一番大きな拍手をもらった。"],"c":"公聴会は「問題なし」で閉会。満員の首都の球場で、熱戦の幕が上がった。"},"96":{"w":"チャーター航空会社が突然の契約打ち切り。理由は「機内の宴会がうるさすぎる」。","m":["3A時代に世話になったバスの運転手に連絡。二つ返事で中西部まで駆けつけてくれた。","陸路案がまとまりかけた矢先、機構から「移動規定で陸路は500マイルまで」。運転手は地図を広げ、ぎりぎりのルートを引き直す。","航空会社が再交渉に応じた。条件は「機内カラオケは一人一曲まで」。"],"x":["バーベキューの名店で大食いの捕手が店の記録を更新。写真が店の壁に貼られた。","外野の噴水を見た若手投手が涙ぐむ。実家の田んぼの用水路を思い出したらしい。"],"c":"バスと飛行機をリレーしてカンザスシティに到着。中西部ロードトリップが始まった。"},"97":{"w":"機構の球場基準委員会が「千葉の仮本拠地は基準未達」と通告。改修計画がなければ、ビジター試合の開催も止めるという。","m":["設計事務所と改修計画を練る。施主の要望欄には「川が見えること」とだけ書いた。","計画が固まりかけた矢先、地元から「河川敷の景観が変わる」と反対の声。商店街のおじさんズが住民説明会を仕切ってくれる。","視察団が川沿いに建つピッツバーグの球場を指さした。「なるほど、こういうことか」。"],"x":["橋を歩いて球場入りする文化に選手がはまり、毎日違う橋を渡る派閥ができた。","名物の餃子の着ぐるみレースに、うちのマスコットがまた乱入しかけ、今度は入口で止められた。"],"c":"改修計画が承認された。川向こうの夕日を背に、美しい球場での試合が始まる。"},"98":{"w":"機構の記録部が、うちの「創立日」を確定できず公式記録が作れない。河川敷に集まったあの日は、創立に入るのか。","m":["初期メンバーに聞き取り。全員、結成日の記憶が微妙に違う。","日付が絞れかけた矢先、近所の草野球チームから「あの日の試合はうちの勝ちだった」と異議。スコアブック探しの大騒ぎに。","スコアブックは{hero}の実家の押し入れにあった。日付も、負けも、はっきり書いてあった。"],"x":["シナモン香るチリをパスタにかける名物料理に、チームの意見が真っ二つに割れた。","球団の殿堂博物館で、ベテラン内野手が百年前のグラブの前から動かなくなった。"],"c":"創立日が公式記録に登録された。最古の球団と、いちばん新しい球団の一戦が成立。"},"99":{"w":"球場の警備スタッフ組合がストライキ中。人員が揃わず、機構はデトロイトでの開催許可を出せずにいる。","m":["組合の集会に顔を出す。差し入れは千葉から持ってきた落花生。","話が前に進みかけた矢先、経営側が「外部業者を入れる」と発表して集会が紛糾。{hero}が壇上で深く頭を下げ、ひとまず場が収まる。","落花生をつまみながらの再協議。組合長「千葉の連中の試合なら、立とうじゃないか」。"],"x":["球場のトラの像に若手がこっそりうちの帽子をかぶせ、復帰したての警備員に笑顔で没収された。","自動車博物館で、千葉時代に使っていたワゴン車と同じ型を発見。全員で囲んで写真を撮った。"],"c":"暫定協定が結ばれ、警備員が持ち場に戻った。モーターシティの熱気の中、プレイボール。"},"100":{"w":"ボストンの辛口コラムニストが「千葉の球団に名門の芝を踏む資格なし」と連載を開始。騒ぎを恐れた機構が延期を検討し始めた。","m":["広報の佐倉がコラムニストに取材を申し込む。返事は「河川敷を見てから来い」。","千葉へ案内する段取りが整った矢先、コラムニストのパスポートが期限切れと判明。ビザで世話になった弁護士事務所が、今度は逆向きに奔走する。","千葉の河川敷。コラムニストは土手に座ったまま、何も言わずにメモ帳を閉じた。"],"x":["記念の第100ステージに、商店街から寄せ書きの横断幕が届いた。大きすぎてクラブハウスに入らない。","名物のクラムチャウダーを{hero}が三杯おかわり。売り子に名前を覚えられた。"],"c":"翌朝の見出しは「河川敷から来た連中」。延期は撤回され、{hero}の打球が緑の壁を越えた。"},"101":{"w":"エース投手の代理人マルコが契約延長の席を蹴った。「伝統球団からも声がかかっている」。","m":["マルコと夕食。彼はステーキを食べながら、うちの財務資料を三回読み返した。","条件がまとまりかけた矢先、別の代理人が{hero}にも接触と報道。球団がざわつくが、{hero}は記者に「帰る河川敷がある」とだけ答えた。","その記事を読んだエースがマルコに電話。「俺もサインする。条件は後でいい」。"],"x":["巨大アーチの展望室で、高所恐怖症の外野手が四つん這いのまま景色を眺めた。","球場の外で、元選手らしき老人が{hero}にサインをねだり、自分のサインもくれた。誰なのかは今も分からない。"],"c":"エースが契約延長にサイン。万全の布陣で、伝統の一戦に臨む。"},"102":{"w":"スポンサーである千葉の酒蔵の日本酒が、輸入表示の不備で球場販売を止められた。契約条件を満たせず、遠征費の支払いが凍結される。","m":["酒蔵の杜氏が英語ラベルを手書きで作り直す。書類の専門家より字がきれいだった。","通関が見えかけた矢先、地元のビール組合から「ビールの街で日本酒とは」と抗議。だが試飲会を開くと、組合長が一番飲んだ。","組合長の発案で、地ビールと日本酒の「乾杯コラボ」が決定。表示の問題もついでに片付いた。"],"x":["名物ソーセージレースに、うちのマスコットが三度目の乱入。今回は、正式な招待状つきだった。","冷える夜のブルペン。投手陣が工場見学でもらったプレッツェルを一本ずつ分け合った。"],"c":"日本酒が売店に並び、遠征費の凍結も解除。ビールとソーセージの街で乾杯の一戦。"},"103":{"w":"湾の港湾当局が、打球を拾うカヤック隊の安全審査を開始。審査中は場外弾が出る打撃練習を禁止された。","m":["{hero}が打撃練習を逆方向限定に切り替える。おかげで流し打ちがやたらうまくなった。","審査が終わりかけた矢先、「千葉の球団のボールが欲しい」とカヤックが倍増し、審査がやり直しに。ただし全員、安全講習を自主的に受けてきた。","担当者がカヤック隊の講習修了証を一枚ずつ確認。「これなら問題ない」。"],"x":["濃霧のブルペン。捕手のミットが見えず、投手は声だけを頼りに投げ込んだ。","坂の街でケーブルカーに乗り遅れた{hero}が、走って追い越してしまった。"],"c":"練習禁止が解除された。湾に白球が落ち、カヤック隊の歓声が上がる。"},"104":{"w":"ボルドウィン氏が再び動いた。新規参入球団に「第二本拠地の確保」を義務づける案を提出。可決なら、うちの試合は全て保留になる。","m":["ハロウェイ委員長が票読みを始める。「今度は物語じゃなく、数字が要る」。","票が固まりかけた矢先、ボルドウィン氏本人が砂漠の球場へ視察に来ると通告。うちの試合を特等席から観るという。","観戦の翌日、ボルドウィン氏が修正案を出した。「義務」の二文字が「推奨」に変わっていた。"],"x":["プール付きの外野席で、若手が「泳いでいいですか」と係員に三回聞いた。答えは三回とも「だめ」。","砂漠の夜、宿舎の屋上で星を数えていた{hero}が、百を過ぎたあたりで眠ってしまった。"],"c":"修正案が可決され、うちの試合は継続へ。屋根の閉じた砂漠のドームで、涼しい一戦が始まる。"},"105":{"w":"リグレーはデーゲームが伝統。だが日本の中継局は「日本の朝に生中継」を譲らず、試合時間が決まらない。","m":["中継局と深夜の電話会議。日本は昼、シカゴは夜中。ケンジは二つの時計を首から下げている。","まとまりかけた矢先、千葉の商店街が「朝の生中継でパブリックビューイング」と勝手に告知。引くに引けず、交渉に一段と熱が入る。","中継局が折れた。「デーゲームのまま。ただし{hero}が打ったら速報で流す」。"],"x":["外野のツタに入ったボールを探していた若手外野手が、本当にツタに絡まった。","球場向かいのビルの屋上席で、日本人留学生たちが手作りの小旗を振ってくれた。"],"c":"風は外野へ。リグレーの青空の下でプレイボール。試合後、ニューヨークの記者から一本の電話が入った。"},"106":{"w":"ニューヨーク遠征の直前、放映権の調整委員会が待ったをかけた。『日本向け中継の権利処理が終わっていない』。","m":["千葉のケーブル局と現地局が共同制作する案が浮上。通訳のケンジが徹夜で契約書を訳す。","まとまりかけた矢先、実況ブースが別番組と二重予約されていたと判明。机が一つしかない。","ケンジが『日英二か国語で一人実況します』と志願。委員会も面白がって条件付きで了承した。"],"x":["{hero}が地下鉄で逆方向に乗り、気づけば海の見える終点。ベーグルを買って戻ってきた。","スタンドに『KASHIWA→NY』の手書きボード。駅前の焼き鳥屋の大将が有給を使って来ていた。"],"c":"放映権の契約が締結。7番線の電車で球場入りし、サブウェイ・シリーズ前哨戦の幕が上がった。"},"107":{"w":"カナダ国境で用具コンテナが止められた。『土の付着した用具は検疫が必要です』。","m":["用具係のゲンさんが一本ずつバットを磨き、土を落とす作業に入る。徹夜で百二十本。","片付いたと思った矢先、ゲンさんのお守り袋から河川敷の土が出てきた。『これは渡せねえ』。","検疫官が事情を聞き、土を密封ケースに入れて『記念品』として申告する方法を教えてくれた。"],"x":["メープルシロップの瓶を土産に買い込みすぎた{hero}。スーツケースが閉まらず、結局チームで分配。","時差がないのに『時差ボケです』と言い張るケンジ。原因はカナダの夜更かしドーナツだった。"],"c":"コンテナが国境を通過。河川敷の土はベンチ裏に置かれ、カナダ遠征が無事に始まった。"},"108":{"w":"選手会と機構の労使交渉が難航。新規参入球団のロースター枠の扱いが決まらず、登録が凍結された。","m":["新規参入審査委員会のホーキンス委員長が仲介役に。双方の会議室を行ったり来たりの日々。","妥結目前、選手会側が『日本式の長時間練習は協約違反では』と指摘。新たな論点が浮上する。","練習日誌を提出。Cリーグ時代から続く記録に『全部自主参加だ』と書いてあり、疑いが晴れた。"],"x":["氷点下の練習で{hero}が千葉から持ってきたカイロを配る。相手チームの分まで配って感謝された。","ミネアポリスの寒さに耐えかねたマスコットが、着ぐるみの下にダウンを着込んでひと回り丸くなった。"],"c":"労使が暫定合意し、ロースター登録の凍結が解除。ツインシティーズの寒空の下、試合が組まれた。"},"109":{"w":"トラッキングデータの共有規約で、新規球団は利用承認待ち。データ野球の相手に、こちらは丸腰だ。","m":["スコアラーの増井さんが手書きのチャートを作り始める。草野球時代からの癖が役に立つ。","承認が下りかけた矢先、データ管理会社から『セキュリティ審査が未了』の通知。また足止めに。","増井さんの手書きノートを見た相手アナリストが『これは芸術だ』と感激し、審査の手伝いを申し出た。"],"x":["球場の水槽で魚に触れるコーナーへ{hero}が並ぶ。子どもたちに順番を譲り続けて結局触れず。","ケンジが相手球団のアナリスト部屋を見学。モニターの数を数えて『うちの部室の三倍』と震えた。"],"c":"データ利用の承認が下りた。手書きチャートと数字を手に、データ野球との対決に挑む。"},"110":{"w":"トレード期限が迫る。リリーフ補強を狙うが、40人枠の空きがなく、委員会の承認も要る。","m":["代理人のハロウェイ氏が三球団をまたぐ三角トレードを提案。電話が鳴りやまない。","成立寸前、別の球団が同じ投手に横から好条件を提示。期限まで残り二時間、白紙に戻りかける。","投手本人が『千葉の河川敷の話を聞いて、こっちで投げたい』と宣言。条件差を気持ちが埋めた。"],"x":["あの日本人レジェンドの古巣で、売店のおばちゃんが『あなたたちの背中、昔を思い出す』と一言。","シアトルの雨に打たれながらも、外野席の常連が『日本の新入り、歓迎だ』と手作りの旗を振ってくれた。"],"c":"期限一分前にトレードが成立。新戦力を加え、レジェンドの古巣での決戦に臨む。"},"111":{"w":"オーナー会議で収益分配の議題が浮上。新規球団にも拠出金が求められたが、金庫が足りない。","m":["房総信金の支店長に国際電話。『世界一の保証人になるとは思わなかった』と笑いつつ融資の検討へ。","審査が進んだ矢先、為替が急変し必要額が膨らむ。支店長の声が一段低くなった。","商店街のおじさんズが応援グッズの売上を寄付。足りない分が千円札の束で届いた。"],"x":["{hero}がクリーブランドの湖畔を走っていたら、地元のランナークラブに勧誘されて名誉会員に。","ゲンさんが相手の投手陣のグラブ手入れに見惚れ、ブルペン裏で油の配合を教え合っていた。"],"c":"拠出金を期日内に納付し、オーナー会議で正式承認。強固な投手陣との対決が決まった。"},"112":{"w":"雨天中止の振替日程が決まらない。両球団の移動日がぶつかり、機構の日程担当も頭を抱えた。","m":["ケンジが日程表を紙に書き出し、全球団の移動を矢印で並べる。壁一面が地図のようになった。","空き日を見つけた矢先、その日に球場で大型コンサートが入っていたと発覚。また振り出しに。","コンサートの主催者が『試合後にライブをやればいい』と提案。昼試合と夜ライブの二本立てに。"],"x":["相手の若手外野手が{hero}にサインを頼みに来た。『実は僕も河川敷出身なんです』。","球場名物のカニを食べたゲンさん。殻を割る手際がよすぎて、売店からスカウトされかけた。"],"c":"振替日程が正式決定。ライブの音合わせを背に、若手主体の強豪とのデーゲームが始まった。"},"113":{"w":"前戦の判定への抗議が問題視され、{hero}に出場停止の聴聞会が開かれることに。","m":["映像を全角度から集め、ケンジが抗議の言葉を一語ずつ英訳。『ほんとに？』しか言っていない。","聴聞会の前日、相手球団が『威嚇行為があった』と追加の申し立て。空気が一気に重くなる。","当日の審判本人が出席し、『彼は私に帽子を取って謝った。日本式だ』と証言してくれた。"],"x":["テキサスの巨大ステーキに挑んだ{hero}。半分残して、翌日の昼までずっと食べていた。","聴聞会の間、ベンチでは選手たちが{hero}の打順を空けたまま、無言でバットを磨いていた。"],"c":"処分なしの裁定が下った。{hero}がスタメンに戻り、前年王者の意地とぶつかる。"},"114":{"w":"ポストシーズン出場資格の締切が迫る。シーズン途中の加入組が、期日までに登録されているか怪しい。","m":["事務所総出で登録書類を洗い直す。トレードで来たリリーフの書類にサインが一つ足りない。","サインを揃えた矢先、機構から『提出時刻が締切の東部時間を過ぎている』との連絡が届く。","西海岸の時刻で出していたと判明。ホーキンス委員長が受付記録を掘り起こし、期限内と認めた。"],"x":["サンディエゴの海辺で、{hero}がアシカに見つめられて一歩も動けなくなった。","ケンジの母から段ボールで梨が届く。『千葉の秋』と書かれた箱を、チーム全員で囲んだ。"],"c":"全員の出場資格が確定。レギュラーシーズンを走り抜き、ポストシーズン進出枠をつかんだ。"},"115":{"w":"ワイルドカードの開催基準。照明と報道席の規定を満たす本拠地がなく、ホーム扱いが認められない。","m":["臨時の本拠地を探して各地に連絡。改修中の球場ばかりで、返事は軒並み『無理だ』。","ある球場の承諾が取れた矢先、報道席が二十席足りないと指摘。日本の記者団が百人来るのに。","記者たちが『立ち見で十分』と署名。ハロウェイ氏が仮設席を一晩で手配し、基準を満たした。"],"x":["フィラデルフィアのチーズステーキの注文方法で{hero}が固まる。店主が笑ってジェスチャーで教えた。","スタンドに房総信金の支店長の姿。『融資先の様子を見に来ただけ』と言いつつメガホンを握っていた。"],"c":"開催条件をクリア。ワイルドカードシリーズを制し、ポストシーズンの扉が開いた。"},"116":{"w":"地区シリーズへの移動用チャーター機が、他球団に先に押さえられていた。ヒューストンが遠い。","m":["航空会社を片っ端から当たる。空いていたのは、塗装が日焼けした小型機が一機だけ。","機体を確保した矢先、ハリケーン接近で航路変更の通知。到着が試合開始ぎりぎりになる。","ゲンさんが機内で用具を全部仕分け、着陸後五分で準備完了の段取りを組み上げた。"],"x":["宇宙センターの見学で、{hero}が宇宙食のアイスを気に入り、ロッカーに箱で常備し始めた。","小型機の機長は元マイナーリーガー。着陸後、『いい肩してるな』と{hero}とキャッチボールをした。"],"c":"滑り込みで球場入り。勢いそのままに、地区シリーズを突破した。"},"117":{"w":"相手球団から用具検査の申し立て。『{hero}のバットは規定外の加工がある』。","m":["用具検査委員会がバットを預かる。ゲンさんの手削りで、メーカーの刻印がないのが問題らしい。","検査が進んだ矢先、一本のバットの重さが規定ぎりぎりと判明。委員の眉がわずかに動く。","ゲンさんが計量の場で湿度を指摘。乾燥室で量り直すと、きっちり規定内に収まった。"],"x":["アトランタの南部料理店で、ケンジが甘い紅茶に驚き、以後『無糖』という英語を研究し始めた。","ゲンさんの削りを見に来た相手のベテランが、引退後に弟子入りしたいと本気で頼んでいた。"],"c":"バットに合格証が発行された。{hero}の一打でリーグCSを突破、ワールドシリーズ進出が決まった。"},"118":{"w":"ワールドシリーズの開始時刻で揉める。日本向け中継は朝の枠を、米国側は夜のゴールデンを譲らない。","m":["放映権の調整委員会が再招集。ニューヨークで二か国語実況をしたケンジも呼ばれる。","夕方開始で折り合いかけた矢先、別のスポーツの決勝と時間が重なると指摘が入った。","ケンジが『日本では朝食を食べながら野球を観る文化がある』と力説。笑いの中で妥協案が通った。"],"x":["名門のスタジアムで、{hero}が記念館の展示を見て、しばらく黙って帽子を取っていた。","柏の駅前に早朝のパブリックビューイング。焼き鳥屋の大将が朝から炭を起こしていた。"],"c":"開始時刻が正式決定。伝統の球場で、ワールドシリーズの激闘が幕を開けた。"},"119":{"w":"千葉から来た応援団に待った。球場規定で鳴り物は禁止、太鼓もトランペットも持ち込めない。","m":["応援団長が手拍子と声だけの応援を考案。練習の様子を動画で送り、球場側に審査を頼む。","許可が出かけた矢先、近隣住民から『夜の大合唱がうるさい』と苦情が入り、審査が保留に。","応援団が近所の清掃ボランティアに参加。住民が逆に『一緒に歌いたい』と言い出した。"],"x":["ロサンゼルスの渋滞にはまったバスの中で、{hero}がチーム全員の似顔絵を描いていた。","ハロウェイ氏が初めてスーツを脱ぎ、応援団のはっぴを着て外野席で手拍子をしていた。"],"c":"手拍子の応援が正式に許可された。スタンドが揺れ、ワールドシリーズ王手をかけた。"},"120":{"w":"優勝した場合のトロフィーに刻む球団名がない。機構は『名前のない球団の優勝は前例がない』と困惑した。","m":["選手、職員、ファンから球団名の案を募る。商店街のおじさんズからだけで三百通届いた。","候補が絞れた矢先、刻印職人から『最終戦の前日までに決めないと間に合わない』と連絡が届く。","ゲンさんが河川敷の土のケースを机に置いた。『名前なんて、ここから来たって分かればいい』。"],"x":["最終戦前夜、{hero}がホテルの部屋で、草野球時代の古いスコアブックを一枚ずつめくっていた。","ホーキンス委員長がこっそり球場に来ていた。『審査した球団の中で、一番手がかかった』と笑う。"],"c":"トロフィーに『河川敷から来た球団』と刻まれた。第7戦を制し、ワールドシリーズ制覇、世界一を達成。"},"121":{"w":"WBC代表選考委員会が、うちの球団の選手を『経歴が海外寄りすぎる』と保留。委員会の中で派閥が割れている。","m":["委員の一人が河川敷時代のスコアブックを見て唸った。『この泥くささは代表に要る』。","選考がまとまりかけた矢先、別派閥の委員が『監督の経歴が草野球しかない』と異議。会議は深夜に及ぶ。","投票は一票差。決め手は委員長の『世界一を獲ったチームを外す理由がない』の一言だった。"],"x":["チェコ代表の選手は本業が電気技師や消防士。{hero}はサインのお返しに、ブレーカーの直し方を教わった。","東京ドームの売り子さんが、うちの応援歌を口ずさんでいた。『河川敷の頃から知ってます』と言われ照れる。"],"c":"代表選考が正式承認。うちの球団の主力が代表に名を連ね、世界一への第一歩を踏み出した。"},"122":{"w":"保険会社が{hero}の出場保険の引受を渋る。『去年、投げすぎです』。保険がなければ大会に出られない。","m":["球団トレーナーが一年分の投球データを英訳し、辞書のような厚さのファイルを保険会社へ送った。","審査が通りかけた矢先、{hero}が寿司屋でわさびを食べすぎて涙目に。『目の不調では』と追加審査になる。","眼科の診断書に『わさびのせいです』という一筆を添えて再提出。担当者が電話口で爆笑した。"],"x":["オーストラリア代表の外野手がカンガルーのぬいぐるみを持参。打席のたびに振っていたのはお守りらしい。","記者会見で通訳が『河川敷』を訳せず『リバーサイド・スタジアム』と言った。翌日から海外紙でもそう呼ばれる。"],"c":"保険が正式に引き受けられ、{hero}の出場が確定。南半球の強打線と真っ向勝負へ。"},"123":{"w":"代表コーチ人事が紛糾。うちの球団のコーチ陣と、NPB出身の名伯楽派がベンチの主導権を譲らない。","m":["両派がブルペンの使い方を朝まで議論。ホワイトボードが三枚、びっしり埋まった。","歩み寄りかけた矢先、スポーツ紙が『代表ベンチ内紛』と一面で報道。選手たちに動揺が走る。","{hero}がロッカーで『どっちのサインでも打ちます』と宣言。コーチ二人が苦笑いで握手した。"],"x":["韓国代表の主将とは独立リーグ時代に一度対戦していた。『あの時の三振、まだ覚えてる』と笑われた。","球場の屋台に『日韓戦限定キムチ焼きそば』が登場。両国のファンが仲良く並んで食べていた。"],"c":"ベンチ体制が一本化された。宿命の日韓戦に、ひとつのチームとして挑む。"},"124":{"w":"台北への移動直前、国際連盟が『公式球の持ち込み数が規定超過』と指摘。練習球を一箱多く積んでいたらしい。","m":["用具係が全ボールの製造番号を一晩で照合。翌朝、指先にマメができていた。","処分が軽く済みかけた矢先、空港でマスコットの着ぐるみが『危険物の疑い』で止められる。","着ぐるみの中身、広報の若手が保安検査場で踊って無害を証明。現地のニュースで話題になった。"],"x":["台北の夜市で{hero}が胡椒餅を五個買い食い。翌朝の体重測定でトレーナーに静かに怒られた。","台北ドームの応援は太鼓とラッパの大音量。声のサインが一切届かず、全員がジェスチャーを覚え直した。"],"c":"規定違反は注意処分で決着。チームは熱狂の台北ドームのグラウンドに立った。"},"125":{"w":"主力の中継ぎが、母の祖国の代表からも招集されていた。大会規定でどちらの国で投げるか決めなければならない。","m":["本人は二人の祖母に電話。どちらも『好きにしなさい』と言って、電話口で泣いた。","決断しかけた矢先、母の祖国の代表監督が台北まで直談判に来る。手土産は巨大なチーズ一玉。","本人が『次の大会はそっちで投げます』と約束。監督は固く握手し、チーズを置いて帰った。"],"x":["置いていかれたチーズが大きすぎて、チーム全員で三日かけて食べた。誰も文句は言わなかった。","オランダ代表は野手全員が190cm超え。並んだ記念写真で{hero}が子どもに見えると話題になる。"],"c":"代表登録が正式に確定。カリブ出身の大型打線に、中継ぎ陣フル稼働で挑む。"},"126":{"w":"準々決勝を前に、ある所属球団が『うちの選手を使いすぎ』と派遣条件の見直しを要求。主砲が帰国寸前に。","m":["GMが先方のオーナーへ毎朝ビデオ通話。起用イニングを表にして送り続けた。","合意しかけた矢先、先方オーナーが休暇でヨットに乗り、電波の届かない沖へ出てしまう。","GMが港で一晩待ち伏せ。帰港したヨットの桟橋で、潮風に吹かれながら書類にサインをもらった。"],"x":["イタリア代表のベンチからエスプレッソの香り。差し入れの一杯で、打撃コーチがすっかり虜になった。","マイアミのホテルのプールで{hero}が日焼け止めを塗り忘れ、翌日の会見に真っ赤な顔で現れた。"],"c":"派遣条件が合意に達し、主砲がチームに残った。負ければ終わりの一発勝負へ。"},"127":{"w":"キューバ代表の主力がビザ手続きの遅れでマイアミ入りできない。{hero}が『相手が揃わない試合は嫌だ』と言い出す。","m":["球団法務が大会事務局と国際連盟の間を走り回り、書類の束を届け続けた。","ビザが下りかけた矢先、ハリケーン接近で空港閉鎖の予報。試合日程そのものが揺らぎ始める。","ハリケーンは進路を逸れ、キューバ代表は試合前夜に到着。ホテルのロビーで自然と拍手が起きた。"],"x":["キューバの老エースとは以前の国際試合以来の再会。『お前の打球、まだ指が覚えている』と握手された。","球場の清掃員のおばあさんは毎試合、違う国のユニフォームで来る。今日はうちの球団のレプリカだった。"],"c":"両軍フルメンバーで試合が正式に開催決定。赤い稲妻との再戦が始まる。"},"128":{"w":"国際連盟の規定委員、通称『ミスター・ルールブック』が投球数制限の解釈を変更。先発予定の投手が投げられない。","m":["投手コーチが規定書を全ページ読み込み、付録の脚注に抜け道を見つけた。","異議申立てが通りかけた矢先、ルールブック氏が『その脚注は来年削除予定です』と言い出す。","『今年はまだ有効ですよね』と押し切った。ルールブック氏は渋い顔で承認印を押した。"],"x":["メキシコ代表の応援団がマリアッチ楽団を連れてきた。9回の攻防の間も、ずっと演奏が続いていた。","試合前、{hero}がタコスの屋台で注文を間違え激辛を完食。汗だくで打席に立ち、二塁打を放った。"],"c":"先発投手の登板が正式に認められた。9回裏の攻防に備え、ブルペンも万全だ。"},"129":{"w":"代表選考委員会の対立が再燃。『決勝に向けて主力温存』派と『全力で行け』派で、準決勝のオーダーが決まらない。","m":["委員長が両派を寿司屋に集めた。カウンター越しだと、なぜか皆の声が小さくなる。","まとまりかけた矢先、温存派が『ある名物GM』からの温存要請メールを持ち出し、場が凍りつく。","{hero}が『明日のことは明日の自分が何とかします』と一言。全力派で決着し、委員長が吹き出した。"],"x":["ベネズエラ代表のスター選手は試合前に必ず母親へ電話する。今日は{hero}も電話口で挨拶させられた。","千葉の商店街のおじさんズが深夜のパブリックビューイングを開催。翌朝、徹夜のまま八百屋を開けたらしい。"],"c":"準決勝のオーダーが確定。スター軍団を止めるため、最強の布陣で臨む。"},"130":{"w":"決勝前夜、国際連盟が『世界一球団の選手が多すぎる代表は公平性に欠ける』と緊急審議を始めた。","m":["各国の代表監督が連名で『問題なし』の意見書を提出。キューバの老エースも署名していた。","審議が終わりかけた矢先、ルールブック氏が欠席。採決に必要な委員がひとり足りない。","ルールブック氏はホテルのエレベーターに閉じ込められていた。救出され、そのまま会議室で賛成票を投じた。"],"x":["決勝のチケットは完売。房総信金の支店長が、支店の慰安旅行の行き先をマイアミに変えて応援に来た。","河川敷の古いグラウンドでは、地元の少年野球チームがラジオを囲み、早朝の中継に耳を澄ませていた。"],"c":"審議は『問題なし』で決着。決勝の舞台でアメリカ代表を破り、世界一の瞬間をつかんだ。"},"131":{"w":"新設のグローバルリーグから招待状。だが創設国会議で『加盟には全大陸の承認が要る』と決まり、票が揃わない。","m":["欧州の承認委員に会うため、ロンドンのパブで三晩続けて待ち伏せた。四晩目に向こうから声をかけてきた。","承認がまとまりかけた矢先、創設国会議の議長選が紛糾。すべての審議が凍結されてしまう。","新議長に選ばれたのは物腰柔らかなラングフォード老紳士。最初の仕事が、うちの球団の加盟承認だった。"],"x":["ロンドンの記者に『クリケットとどう違う？』と聞かれ、{hero}が二十分説明。翌日の見出しは『よく分からない』。","開幕戦の観客の半分はサッカーのユニフォーム姿。ホームランのたびにスタンドでチャントが起きた。"],"c":"加盟承認が届き、グローバルリーグに正式参戦。野球の新天地ロンドンで開幕戦を迎えた。"},"132":{"w":"放送権の配分で揉めた。アジアの放送局連合が『試合開始が深夜すぎる』と中継を拒否している。","m":["球団広報が全大陸の時差表を作成。どこでも『まあ見られる』時刻を探し始めた。","朝9時開始で合意しかけた矢先、欧州側が『朝食中に野球は見ない』と猛反発。","結局『朝食付きパブリックビューイング』という謎の企画で、両者が納得してしまった。"],"x":["WBCで再会したあの韓国の主将が、アジア選抜でも主将に。『また会ったな』と笑い合った。","ソウルの球場名物のチキンを、{hero}がベンチ裏で隠れ食い。中継カメラにばっちり映っていた。"],"c":"放送権が正式に合意。アジア全域に生中継される中、アジア最強決定戦が始まった。"},"133":{"w":"シドニー遠征のチャーター機が、12月の繁忙期で一機も取れない。このままでは選手が移動できない。","m":["マネージャーが乗り継ぎ便をパズルのように組み合わせ、三か国経由のルートを作り上げた。","全員が揃いかけた矢先、経由地で{hero}のバットケースだけが別の国へ旅立ってしまう。","バットは一日遅れでシドニーに到着。タグには見たこともない国のスタンプが四つ押されていた。"],"x":["真夏のクリスマス。サンタ帽の選手たちがビーチでキャッチボールをし、現地テレビに映っていた。","東京で会ったオーストラリアの外野手が、カンガルーのぬいぐるみを差し出した。『次は君が持ってて』。"],"c":"全員がシドニーに集結。真夏のクリスマスゲームのプレイボールがかかった。"},"134":{"w":"創設国会議で『公式球をどの国のメーカーにするか』が政治問題に。カリブ諸国が自国製を譲らない。","m":["各国のボールを並べてブラインドテスト。選手たちが目隠しのままノックを受けた。","決まりかけた矢先、テスト用のボールが一箱、地元の子どもたちに持ち去られてしまう。","子どもたちは路地で試合をしていた。それを見たラングフォード議長が『全部使おう』と持ち回り案を出した。"],"x":["カリブ選抜のベンチは試合中ずっと踊っている。{hero}もつられてステップを踏み、コーチに睨まれた。","路地の子どもたちに{hero}がサインボールを配った。お返しは牛乳パックで作った手作りのグラブだった。"],"c":"公式球問題が決着し、試合が正式に組まれた。陽気な強打者たちとの一戦へ。"},"135":{"w":"カラカスの球場が改修中で、照明が半分しか点かない。リーグは『ナイター開催は不可』と判断した。","m":["地元の電気工事組合が、ボランティアで夜通し配線作業を始めてくれた。","復旧しかけた矢先、雷が落ちて変電設備が故障。工事は振り出しに戻ってしまう。","ファンが車のヘッドライトを外野へ向けて並べた。その光景に心を打たれ、リーグが特例で発電車を手配した。"],"x":["電話で挨拶したベネズエラのスターの母が球場に来ていた。{hero}を見つけ、手作りのアレパを持たせてくれた。","国歌斉唱でスタンドが総立ちに。鳥肌が立ったと、ベテラン捕手が珍しく目を潤ませていた。"],"c":"照明が復旧し、ナイター開催が決定。熱狂のスタンドの下でプレイボール。"},"136":{"w":"ドミニカ共和国が『選抜ではなく国家代表として単独加盟したい』と主張。リーグの枠組みが揺らぎ始めた。","m":["創設国会議が緊急招集された。ドミニカの協会会長は『野球は我が国の誇りだ』と一歩も引かない。","例外を認めかけた矢先、他の三か国も『うちも単独で』と言い出し、会議は収拾不能に。","うちの球団が『単独代表とは毎年エキシビションを組む』と提案。会長が葉巻を置いて頷いた。"],"x":["牛乳パックのグラブをくれた少年が、今日は本物のグラブを手にしていた。地元の少年団に入ったらしい。","球場の売店のおじさんは、どこの国の言葉で頼まれても『ホットドッグ二つね』だけは理解できる天才だ。"],"c":"ドミニカの単独加盟が正式承認。野球大国の誇りを懸けた一戦が組まれた。"},"137":{"w":"正捕手が肩を痛めた。代役を立てたいが、リーグ規定は『シーズン途中の補強は不可』。","m":["控えのベテラン捕手を昇格させるため、英語・スペイン語・日本語の三通りの書類を準備した。","書類が揃いかけた矢先、リーグの規定委員にあのミスター・ルールブックが就任していたと判明する。","今回はあっさり承認。『昇格は補強ではない。それに、あのエレベーターの夜の借りがある』。"],"x":["プエルトリコの若い捕手が、うちのベテラン捕手にミットの手入れを教わりに来た。名捕手の系譜は国を越える。","昇格したベテラン捕手は河川敷時代からの古株。ロッカーには当時の泥のついたミットが今も吊ってある。"],"c":"ベテラン捕手の登録が完了。名捕手の系譜に挑む一戦に間に合った。"},"138":{"w":"国境で用具コンテナが税関に留め置かれた。『バットの木材が検疫対象です』とのこと。","m":["用具係が木材の産地証明を取り寄せた。工房の老職人が、手書きで証明書を書いてくれた。","通関しかけた矢先、コンテナからマスコットの着ぐるみが出てきて『動物の毛皮では』と再検査に。","台北の空港に続いて二度目。中身の広報若手が税関で踊り、今回も無害を証明してみせた。"],"x":["トロントの朝は極寒。{hero}はメープルシロップたっぷりのパンケーキを毎朝十枚食べて体を温めた。","北米選抜の主砲は、日本の野球漫画で育ったらしい。好きな決め台詞を、たどたどしい日本語で言ってくれた。"],"c":"用具が無事に通関し、試合は予定通り開催。国境を越えた強豪との一戦へ。"},"139":{"w":"プレーオフの開催地をめぐり、創設国が三つ巴の誘致合戦。開催地が決まらなければ試合が組めない。","m":["ラングフォード議長が各国の提案書を読み比べる。ニューヨーク案が一歩リードした。","決まりかけた矢先、ある放送局連合が『ニューヨーク開催なら放映しない』と通告。理由はまた時差。","朝食付きパブリックビューイングが再び採用された。今回は各国の朝ごはんメニュー付きで決着。"],"x":["ニューヨークの地下鉄で、{hero}は誰にも気づかれなかった。隣の老人に『野球やってる顔だね』とだけ言われた。","プレーオフ前夜、選手たちが河川敷時代の練習日誌を回し読み。『字が読めない』箇所で全員が笑った。"],"c":"開催地がニューヨークに正式決定。世界選抜オールスターを破り、プレーオフ進出を決めた。"},"140":{"w":"決勝の地は東京。ところが一部の創設国が『開催国チームに有利だ』と抗議し、ボイコットをちらつかせる。","m":["議長が各国を回って説得。うちの球団も『三塁側のアウェーベンチを使う』と申し出た。","抗議が収まりかけた矢先、東京のホテルが国際会議と重なり満室に。相手チームの泊まる場所がない。","千葉の商店街が民泊を募り、各国の選手が八百屋や居酒屋の二階に泊まることに。これが大好評だった。"],"x":["居酒屋の二階に泊まった欧州の選手が、昔の打ち上げの店騒動を聞き『交互に使えばいい』と同じ結論を出した。","東京ドームの売り子さんが、決勝の日だけ自腹でうちの応援タオルを配っていた。『河川敷からのファンなので』。"],"c":"全創設国が決勝参加を表明。満員の東京で、世界の頂点に再び立った。"},"141":{"w":"殿堂入りの候補資格が届いた。ただし『レジェンドシリーズで実力を示すこと』が条件。往年の名選手が集まらない。","m":["殿堂の事務局長が往年の名選手たちに手紙を書いた。返事は達筆な筆書きで届いた。","揃いかけた矢先、昭和の大打者が『ナイターは目が見えんから昼にしろ』と注文をつける。","デーゲームに変更。大打者はバットを杖に打席へ向かい、構えた瞬間に二十歳若返って見えた。"],"x":["殿堂担当の老記者『赤ペンの大槻』は、河川敷時代からうちの球団の記事を切り抜いて保存していた。","昭和レジェンズのベンチには魔法瓶と羊羹。試合の途中、{hero}にも一切れ回ってきた。"],"c":"昭和レジェンズとの対戦が実現。伝説の打者たちの打球を、身をもって知った。"},"142":{"w":"殿堂の記者投票が始まった。辛口の論説委員・鷹野が『草野球上がりは殿堂の格に合わない』とコラムで批判。","m":["赤ペンの大槻が反論コラムを寄稿した。見出しは『格は泥から生まれる』。","論争が落ち着きかけた矢先、平成のエースが『鷹野さんにも打席に立ってもらおう』と言い出し騒然となる。","鷹野が打席へ。三球三振のあと、ベンチで『いい球だった』と小さくつぶやいたのを{hero}は聞いていた。"],"x":["平成レジェンズのエースは、今は焼肉店の店主。試合後、両軍に特上カルビを振る舞ってくれた。","若手がエースの昔の野球カードにサインを頼んだ。『このカード、髪が多いな』と本人が笑った。"],"c":"記者投票の議論が本格化した。時代を彩ったエースたちとの対決が実現した。"},"143":{"w":"対戦相手の公式記録が散逸しており、殿堂委員会が『正式な対戦扱いにできない』と判断した。","m":["球団の資料係が古い新聞や遠征記録を集め、名手たちの成績を一つずつ掘り起こしていく。","記録がまとまりかけた矢先、肝心の帳簿一冊が湿気で読めなくなっていると判明する。","名手の孫娘が、祖父が自宅でつけていた同じ記録の写しを届けてくれた。インクの跡が丁寧だった。"],"x":["名手たちの守備練習を見たうちの遊撃手が、黙ってノートを取り始めた。ページはすぐに埋まった。","試合前、両軍が帽子を取って黙祷。『語られてこなかった名前のために』という言葉に球場が静まった。"],"c":"記録が公式に認められ、対戦が成立。語り継がれる名手たちと同じグラウンドに立った。"},"144":{"w":"デッドボール時代の規則で戦うことに。だが当時のルールブックが現存せず、試合条件が決まらない。","m":["ミスター・ルールブックが私蔵の古書を持ってきた。ページをめくるたびに紙の粉が舞う。","条件がまとまりかけた矢先、古書に『ボールは一試合一個』とあり、用具係が真っ青になる。","一個のボールを泥だらけになるまで使う試合に。河川敷を思い出し、選手たちはなぜか生き生きしていた。"],"x":["相手選抜はバントと盗塁ばかり。{hero}が『懐かしい』と言うと、ベテラン捕手が『千葉の草野球だな』と頷いた。","試合後、泥まみれのボールを殿堂に寄贈。ラベルには『一試合一個』とだけ書かれた。"],"c":"試合条件が確定。泥くさい野球の原点で、うちの球団の原点も思い出した。"},"145":{"w":"殿堂投票の中間集計が報道された。基準まであと少し。鷹野が『この試合を見て判断する』と宣言した。","m":["赤ペンの大槻が各地の記者に手紙を書き、河川敷からの全記録を添えて送った。","票が伸びかけた矢先、ある記者が『世界一は運だった』と書き、反論の嵐でネットが炎上する。","{hero}が会見で『運も実力のうちと、河川敷のおじさんに教わりました』と返し、場が和んだ。"],"x":["往年の強打者たちが打撃練習で場外弾を連発。球拾いの少年団が『もう走れない』と座り込んだ。","ピンストライプを着た老人がベンチ裏で{hero}の肩を叩き、『いいスイングだ』とだけ言って去った。"],"c":"鷹野のコラムは『認めざるを得ない』で締めくくられた。殺人打線の再来と真っ向から打ち合い、勝ちきった。"},"146":{"w":"殿堂委員会で資格区分の審議が止まった。球団ごと殿堂入りする前例がなく、どの区分にも当てはまらない。","m":["事務局長が過去百年の議事録をめくり、似た前例を探し続ける。","前例が見つかりかけた矢先、それが『球場の看板犬』を名誉展示した議事録だったと判明し、脱力する。","ついに新区分『チームとしての殿堂入り』が提案され、委員会の正式な議題に上がった。"],"x":["伝説の左腕は登板前に必ずガムを三枚噛む。{hero}も真似してみたが、顎が疲れただけだった。","マスコットの中身の広報若手が、着ぐるみのまま殿堂見学に参加。展示品と間違われて写真を撮られた。"],"c":"『チームとしての殿堂入り』が正式な審議対象に。打てない投手たちから、執念の一点をもぎ取った。"},"147":{"w":"チーム殿堂入りの審議に『創設メンバー全員の証言』が必要に。河川敷時代の仲間は今や散り散りだ。","m":["商店街のおじさんズの人脈で、八百屋、魚屋、元居酒屋の店主と、初期メンバーが次々に見つかる。","あと一人で揃いかけた矢先、最後の一人は北海道で漁師をしていて、漁期中は連絡がつかないと判明。","漁協の無線経由で証言が届いた。『あの頃が一番楽しかった。でも今のチームが一番強い』。"],"x":["一発の嵐に備え、外野陣がフェンス際の捕球練習を一週間。壁にめり込んだ跡が三つ残った。","店を畳んだ元居酒屋の店主は、うちの打ち上げ用の暖簾を今も大事に取ってあった。"],"c":"創設メンバー全員の証言が揃い、審議が前進。一発の嵐を最後までしのぎきった。"},"148":{"w":"殿堂の最終投票日が決まった。ところが投票資格を持つ記者の名簿に誤りが見つかり、投票は延期に。","m":["事務局が名簿を洗い直す。赤ペンの大槻は、自分の名前に赤ペンで丸をつけて確認していた。","整いかけた矢先、投票用紙の候補欄で紛糾。河川敷の頃から、うちの球団には決まった呼び名がない。","委員会の結論は『皆がうちの球団と呼ぶチーム』。前代未聞の表記で投票用紙が刷り上がった。"],"x":["ゴールドグラブ選抜の内野陣は、打球がどこへ飛んでも既にそこにいる。{hero}は打った瞬間に天を仰いだ。","河川敷のグラウンドの管理人さんが、今もうちの球団のために一塁線の小石を拾い続けていると聞いた。"],"c":"最終投票日が正式に確定。鉄壁の守備網をこじ開け、決勝点をもぎ取った。"},"149":{"w":"最終投票の前夜、鷹野が『明日の試合を見てから票を書く』と保留。一票で届くかどうかの瀬戸際だ。","m":["赤ペンの大槻が鷹野を河川敷へ連れ出した。二人は夜の土手を、ただ黙って歩いた。","鷹野の心が傾きかけた矢先、保守派の委員が『チームの殿堂入りは前例がない』と投票延期を動議。","動議に反対したのはミスター・ルールブックだった。『前例は、作るためにある』。会議室が静まり返った。"],"x":["ドリームチームのベンチには、これまで戦ったレジェンドたちが勢ぞろい。昭和の大打者が羊羹を配っていた。","試合前夜、{hero}が河川敷で一人素振り。気づけば創設メンバー全員が、土手に座って見ていた。"],"c":"延期動議は否決された。最後の扉が開き、明日、運命の開票が行われる。"},"150":{"w":"開票当日。得票は基準ぎりぎりの見込み。最後の一票、鷹野の封筒だけがまだ届いていない。","m":["封筒は手違いで、千葉の河川敷近くの郵便局に迷い込んでいた。局員が自転車で走り出す。","間に合いかけた矢先、開票会場の手前で自転車がパンク。締切まで残り十分。","商店街のおじさんズと房総信金の支店長がリレーで封筒をつなぎ、締切一分前に投票箱へ滑り込ませた。"],"x":["鷹野の票には一行だけ。『格は泥から生まれる。大槻に借りた言葉だが、今は私の言葉だ』。","殿堂の展示室に、『字が読めない』と突き返された練習日誌と、定款に『世界一』と書いた差し戻し書類が並んだ。"],"c":"殿堂入りが正式決定。銘板には『うちの球団』と刻まれた。河川敷から始まった歩みは、永遠のダイナスティになった。"}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=n=>Math.round(n).toLocaleString();
const money=n=>(n<0?'−':'')+'$'+fmt(Math.abs(n));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const STAD=[['河川敷グラウンド',0,1.0,1.0],['市民球場',1e6,1.2,1.02],['地方本格スタジアム',8e6,1.5,1.05],['プロ仕様ボールパーク',4e7,2.0,1.08],['全天候型ハイテクドーム',1.5e8,3.0,1.12],['ワールドドームボールパーク',3e8,5.0,1.20],['ワールドクラシック・スタジアム',8e8,7.0,1.30]];
const BAT=['m','p','r','a','f','c'],BATN={m:'ミート',p:'パワー',r:'走力',a:'肩力',f:'守備力',c:'捕球'},BW={m:.25,p:.30,r:.12,a:.08,f:.15,c:.10};
const PIT=['v','k','s','b'],PITN={v:'球速',k:'コントロール',s:'スタミナ',b:'変化量'},PW={v:.35,k:.25,s:.20,b:.20};
const BALC=[0,.85,.95,1.0,1.1];
const ORD=[1.05,.95,1.15,1.25,1.05,.95,.90,.85,.85],ROT=[1.30,1.10,1.00,.85,.75],REL=[1.30,1.10,.90,.85,.85];
const STG=DATA.st.filter(s=>s[0]<=MAXLV);

const rank=x=>x>=240?'S':x>=220?'A':x>=200?'B':x>=160?'C':x>=120?'D':x>=80?'E':x>=40?'F':'G';
const kmh=v=>Math.round(120+v/255*49),vOf=k=>Math.round((k-120)/49*255);
const brk=b=>Math.round(b/255*24);
/* 野手のパワー以外は15段階（内部値＝段階×17） */
const LVK={m:1,r:1,a:1,f:1,c:1},lvOf=x=>Math.max(1,Math.min(15,Math.round(x/17))),snapL=x=>lvOf(x)*17;
const LR=l=>l>=15?'S':l>=13?'A':l>=11?'B':l>=9?'C':l>=7?'D':l>=5?'E':l>=3?'F':'G';
const LCOST=[1100,1450,1850,2400,3100,4000,6000,9000,13500,20000,30000,45000,70000,110000];
const rk=(k,x)=>LVK[k]?LR(lvOf(x)):rank(x);
const dn=(k,x)=>LVK[k]?LR(lvOf(x))+' '+lvOf(x):rank(x)+' '+x;
const snapB=st=>{if(st)for(const k in LVK)if(st[k]!=null)st[k]=snapL(st[k]);return st};

  h+=`<div class="sec">球団職員・スカウト<span>資金+${bf.sales}%・練習Pt+${bf.coach}%・割引${bf.nego}%・掘り出し物${Math.min(3,bf.eye)}枠</span></div>`+(sf.length?sf.map(x=>`<div class="row"><span class="pill">${SROLE[x.role][2]}</span><div class="nm">${esc(x.name)}　<b>${SROLE[x.role][0]}</b><small>${SROLE[x.role][1]} ${x.role==='eye'?'+1枠':(x.role==='nego'?'−':'+')+(CLB[x.cls]||2)+'%'}　${esc(x.cls)}級　週給 ${money(x.sal/2/52)}</small></div><button class="btn s" data-a="fire" data-i="${x.id}">解雇</button></div>`).join(''):'<div class="card mut">選手の育成画面の「職員・スカウト」から、選手を球団職員（営業・コーチ）やスカウト（目利き・交渉）に転身させられます。</div>');
  h+=`<div class="sec">お金の流れ</div><div class="card mut">本体で獲得したpt × $500 × 球場倍率（＋営業）が毎日入ります。毎朝の観客の入場料、勝利で当日収入の45%・敗北で10%の試合収入。年俸は毎週月曜に全員分（職員・スカウトは半額）を支払います。</div>`;
  h+=`<div class="sec">球団史<span>${(S.slog||[]).length}話</span></div><div class="card" style="padding:4px 12px;max-height:340px;overflow-y:auto">${(S.slog||[]).length?S.slog.map(e=>`<div class="lg"><div>${KIND[e.k][0]} ${esc(e.t)}<i>Lv.${e.lv}　${e.d}</i></div></div>`).join(''):'<div class="empty">まだ歴史はこれから</div>'}</div>`;
  h+=`<div class="sec">データ</div><div class="card"><div class="mut">本体との同期：開始日 ${new Date(S.t0).toLocaleDateString()}　同期済み ${fmt(S.synced||0)}pt</div><div class="fb"><button data-a="reset">野球部をリセット</button></div></div>`;
  return h;
}
function render(){
  $('#hero').innerHTML=hero();
  $('#tabs').innerHTML=[['t','試合'],['p','選手'],['s','スカウト'],['b','球団']].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  $('#main').innerHTML=tab==='t'?vT():tab==='p'?vP():tab==='s'?vS():vB();
  $('#sheet').innerHTML=form?vF():'';
  const gt=S.gate,sq=S.sq||[];$('#pop').innerHTML=!(gt&&!gt.seen)&&sq.length?`<div class="pp" style="text-align:left"><h4 style="text-align:center">📖 球団の歩み</h4>${sq.map(e=>`<div style="margin:8px 0;font-size:14px;line-height:1.6"><span class="pill ${e.k==='c'?'y':e.k==='q'?'r':''}">${KIND[e.k][0]} ${KIND[e.k][1]}</span> <span class="mut">Lv.${e.lv}</span><br>${esc(e.t)}</div>`).join('')}<button class="btn" style="width:100%;margin-top:6px;padding:11px" data-a="sok">閉じる</button></div>`:gt&&!gt.seen?`<div class="pp"><div class="mut">${gt.d}　${esc(gt.tier)}</div><h4>🏟 今日の観客動員</h4><div class="bigm">${fmt(gt.att)}人${gt.full?'<div style="font-size:14px;color:var(--dg)">満員御礼！</div>':''}</div><table><tr><td>キャパ</td><td>${fmt(gt.cap)}人</td></tr><tr><td>直近3日の平均 ${fmt(gt.avg)}pt</td><td>×${gt.r1.toFixed(2)}</td></tr><tr><td>審議対象クリア ${gt.cl}回×0.6</td><td>×${gt.r2.toFixed(1)}</td></tr>${gt.sb?`<tr><td>営業ボーナス</td><td>+${gt.sb}%</td></tr>`:''}<tr><td>入場料収入</td><td style="color:var(--ok)">+${money(gt.rev)}</td></tr></table>${gt.cl?'':'<div class="mut">審議対象のミッションをクリアすると観客が入ります</div>'}<button class="btn" style="width:100%;margin-top:6px;padding:11px" data-a="gok">受け取る</button></div>`:'';
}
function mk(r,i){const p={id:uid(),name:r[0],pos:r[1],cls:r[2],sal:r[14],fund:r[15]*3.75,db:i,fat:0,ord:S.roster.length};
  if(r[1]==='B'){p.bal=r[3];p.st=snapB({m:r[4],p:r[5],r:r[6],a:r[7],f:r[8],c:r[9]})}else{p.role=starters().length<5?'SP':'RP';p.st={v:vOf(r[10]),k:r[11],s:r[12],b:Math.round(r[13]/24*255)};p.ps=genArs(r[13],hs(r[0]),r[19])}
  return p}
const TWN=t=>t===2?'二刀流':'二刀流(控)';
function mkAll(r,i){const p=mk(r,i);if(!r[16])return [p];
  const o={id:uid(),name:r[0],pos:r[1]==='B'?'P':'B',cls:r[2],sal:0,fund:0,db:i,fat:0,ord:S.roster.length+1,twinOf:p.id,tw:r[16]};
  if(o.pos==='B'){o.bal=r[3];o.st=snapB({m:r[4],p:r[5],r:r[6],a:r[7],f:r[8],c:r[9]})}else{o.role=starters().length<5?'SP':'RP';o.st={v:vOf(r[10]),k:r[11],s:r[12],b:Math.round(r[13]/24*255)};o.ps=genArs(r[13],hs(r[0]),r[19])}
  p.twin=o.id;p.tw=r[16];return [p,o]}
function reorder(id,dir){const p=S.roster.find(x=>x.id===id);const list=(p.pos==='B'?hitters():pitchers());const i=list.indexOf(p),j=i+dir;if(j<0||j>=list.length)return;[list[i].ord,list[j].ord]=[list[j].ord,list[i].ord];
  if(p.pos==='P'){const ps=pitchers();ps.forEach((q,k)=>q.role=k<5?'SP':'RP')}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=t.dataset.i;
  if(a==='tab')tab=i;
  else if(a==='open'){openSheet(i);return}
  else if(a==='close'){closeSheet();return}
  else if(a==='sc')S.sc=+i;
  else if(a==='up'||a==='dn'){reorder(i,a==='up'?-1:1);save()}
  else if(a==='tr'){const p=S.roster.find(x=>x.id===i),k=t.dataset.k,n=+t.dataset.n,c=costN(p,k,n);if(S.pt<c)return;S.pt-=c;p.st[k]=toIdx(k,Math.min(maxU(k),unitOf(k,p.st[k])+n));save();toast(`${p.name} ${k==='v'?PITN.v:(BATN[k]||PITN[k])} → ${disp(p.st,k)}`)}
  else if(a==='bal'){const p=S.roster.find(x=>x.id===i),c=costBal(p);if(S.pt<c||p.bal>=4)return;S.pt-=c;p.bal++;save()}
  else if(a==='role'){const p=S.roster.find(x=>x.id===i);p.role=p.role==='SP'?'RP':'SP';save()}
  else if(a==='swap'){const p=S.roster.find(x=>x.id===i);if(p.pos==='B'){p.pos='P';p.role=starters().length<5?'SP':'RP';p.st2=p.st;p.st=p.stP||{v:vOf(128),k:35,s:40,b:Math.round(3/24*255)}}else{p.pos='B';p.stP=p.st;p.st=snapB(p.st2||{m:35,p:30,r:35,a:30,f:30,c:30});p.bal=p.bal||2}p.ord=S.roster.length;save()}
  else if(a==='gok'){S.gate.seen=true;save()}
  else if(a==='sok'){S.sq=[];save()}
  else if(a==='cv'){form.cv=!form.cv}
  else if(a==='cvr'){const p=S.roster.find(x=>x.id===i),r=t.dataset.k,sf=S.staff=S.staff||[],kind=SROLE[r][2],n=sf.filter(x=>SROLE[x.role][2]===kind).length;if(n>=(kind==='スカウト'?SCT_MAX:STF_MAX)||p.hero||p.twinOf||p.rent)return;
    if(!confirm(p.name+'を'+SROLE[r][0]+'（'+kind+'）にしますか？選手としては戻せません'))return;
    sf.push({id:uid(),name:p.name,cls:p.cls||'草野球',role:r,sal:p.sal,db:p.db});S.roster=S.roster.filter(x=>x.id!==i&&x.id!==p.twin);S.sl=null;S.log.unshift({d:dk(new Date()),t:p.name+'が'+kind+'（'+SROLE[r][0]+'）に転身'});closeSheet();save();toast(p.name+'が'+SROLE[r][0]+'に！');return}
  else if(a==='fire'){const x=(S.staff||[]).find(q=>q.id===i);if(!x||!confirm(x.name+'を解雇しますか？'))return;S.staff=S.staff.filter(q=>q.id!==i);S.bought=S.bought.filter(q=>q!==x.db);S.sl=null;save()}
  else if(a==='pu'){const p=S.roster.find(x=>x.id===i),o=ars(p)[+t.dataset.k];if(!o||o.l>=7)return;const c=pCost(o);if(S.pt<c)return;S.pt-=c;o.l++;syncB(p);save();toast(`${PTY[o.t][0]} Lv${o.l}`)}
  else if(a==='pl'){const p=S.roster.find(x=>x.id===i),k=t.dataset.k,c=PTY[k][4],a_=ars(p);if(S.pt<c||a_.length>=MAXPS||a_.some(o=>o.t===k))return;if(!confirm(PTY[k][0]+'を'+fmt(c)+'Ptで習得しますか？'))return;S.pt-=c;a_.push({t:k,l:1});syncB(p);save();toast(PTY[k][0]+'を習得！')}
  else if(a==='sell'){const p=S.roster.find(x=>x.id===i);if(!confirm(p.name+'を'+money(p.fund/2)+'で売却しますか？'))return;S.cash+=p.fund/2;S.roster=S.roster.filter(x=>x.id!==i&&x.id!==p.twin);S.bought=S.bought.filter(x=>x!==p.db);closeSheet();save();toast('売却しました')}
  else if(a==='rent'){const r=DATA.db[+i],f=price(+i)/5;if(S.cash<f)return;S.cash-=f;S.bought.push(+i);const ps=mkAll(r,+i);ps.forEach(q=>{q.rent=addD(2);q.sal=0;q.fund=0});S.roster.push(...ps);S.log.unshift({d:dk(new Date()),t:'レンタル加入：'+r[0]+'（'+addD(2).slice(5).replace('-','/')+'まで）'});toast(r[0]+'をレンタル！（3日間）');if(tryMatch(dk(new Date()))){tab='t';toast('練習試合をしました！')}save()}
  else if(a==='buy'){const r=DATA.db[+i],f=price(+i);if(S.cash<f)return;S.cash-=f;S.bought.push(+i);S.roster.push(...mkAll(r,+i));save();toast(r[0]+'が入団！');if(tryMatch(dk(new Date()))){tab='t'}if(S.lv<=4){const need=RECRUIT[S.lv];if(heads()>=need)advance();save()}}
  else if(a==='stad'){const n=STAD[S.stad+1];if(!n||S.cash<n[1])return;S.cash-=n[1];S.stad++;save();toast(n[0]+'が完成！')}
  else if(a==='reset'){if(!confirm('野球部のデータを全部消します。よろしいですか？（本体のデータには影響しません）'))return;localStorage.removeItem('bb');init();return}
  render();
});
function init(){
  load();
  if(S)S.roster.forEach(p=>{if(p.db!=null&&DATA.db[p.db]&&!p.hero)p.name=DATA.db[p.db][0]});
  if(!S){
    const b=body();let name='タロウ';try{name=(b.set&&b.set.hero)||'タロウ'}catch(e){}
    S={t0:Date.now(),synced:0,pt:0,cum:0,cash:500000,lv:1,wins:0,lose:0,stad:0,rot:0,roster:[],bought:[],log:[],day:null,sc:0};
    S.roster.push({id:uid(),name,pos:'B',hero:true,dual:true,cls:'草野球',sal:0,fund:0,fat:0,ord:0,bal:2,st:snapB({m:38,p:35,r:40,a:36,f:34,c:33}),stP:{v:vOf(130),k:38,s:45,b:Math.round(4/24*255)}});
    S.log.unshift({d:dk(new Date()),t:'河川敷で'+name+'がひとり素振りを始めた'});
    save();
  }
  if(!S.sty){S.sty={lv:S.lv,n:0,c:0};const y=STY[S.lv];if(y){stEv('w',y.w,S.lv);const f=ayumi(),ev=sched(S.lv);while(S.sty.n<ev.length&&ev[S.sty.n].f<=f)S.sty.n++;if(S.sty.n){const e=ev[S.sty.n-1];stEv(e.k,e.t,S.lv)}if(f>=1){stEv('c',y.c,S.lv);S.sty.c=1}}}
  if(!S.v3){S.roster.forEach(p=>{if(p.pos==='B')snapB(p.st);snapB(p.st2);if(p.pos==='P'){ars(p);syncB(p)}});S.staff=S.staff||[];S.v3=1;save()}
  S.ts=S.ts||Math.floor(Math.random()*1e9);onOpen();
  daily();render();
}
init();
function openSheet(id){form={id,cv:0};if(!(history.state&&history.state.sheet))history.pushState({sheet:1},'');render()}
function closeSheet(){if(history.state&&history.state.sheet)history.back();else{form=null;render()}}
window.addEventListener('popstate',()=>{if(form){form=null;render()}});
(()=>{let y0=null,dy=0,el=null;
  const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{el=e.target.closest('.fm');if(!el)return;const inHead=!!e.target.closest('.fmh');if(el.scrollTop>0&&!inHead){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null||!el)return;dy=e.touches[0].clientY-y0;if(dy>0){el.classList.add('drag');el.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null||!el)return;el.classList.remove('drag');if(dy>90){el.style.transform='translateY(100%)';setTimeout(closeSheet,150)}else el.style.transform='';y0=null;dy=0},{passive:true});
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();onOpen();daily();render()}});
</script>
</body>
</html>
