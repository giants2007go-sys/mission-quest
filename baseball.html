body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}

.row .nm{flex:1;min-width:0}.row .nm small{display:block;color:var(--mut);font-size:11px}

.btn[disabled]{opacity:.45}
.mut{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13px}
.stat{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 8px;align-items:center;font-size:13px;margin:4px 0}
.stat .b{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.stat .b i{display:block;height:100%;background:var(--ac)}
.stat .b i.star{background:var(--y)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--bd);color:var(--tx)}
.pill.y{background:var(--y)}.pill.r{background:#ffb3b3}
.sc{font-size:30px;font-weight:800;text-align:center;letter-spacing:2px}
.sc small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:0}
.lg{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}.lg:last-child{border:0}
.lg i{font-style:normal;color:var(--mut);font-size:11px;display:block}

.pg{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0 3px}.pg i{display:block;height:100%;background:var(--y)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:transform .25s;z-index:30;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20}
.fm{background:var(--card);border-top:2px solid var(--bd);box-shadow:0 -8px 30px rgba(0,0,0,.18);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto}
.fm h3{margin:0 0 8px;font-size:15px}
.fb{display:flex;gap:8px;margin-top:12px}.fb button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700}

.sv button[disabled]{opacity:.4}
</style>
</head>
